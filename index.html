<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tend Turn Companion</title>
<style>
  :root {
    --ground: #EFF1EC;
    --surface: #FCFDFB;
    --surface-2: #F2F5F1;
    --ink: #1E2422;
    --muted: #5D6763;
    --line: #D4DAD4;
    --accent: #2F7A72;
    --accent-ink: #F2F8F6;
    --gain: #2A7350;
    --gain-soft: #DDEBE2;
    --spend: #C05B4D;
    --spend-soft: #F4E2DE;
    --coin: #A98014;
    --coin-soft: #F1E8CE;
    --water: #4A6FA5;
    --water-soft: #DFE7F2;
    --chop: #A34A6B;
    --mine: #8A6D1C;
    --shadow: 0 1px 3px rgba(30, 36, 34, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131816;
      --surface: #1C2220;
      --surface-2: #242B28;
      --ink: #E6EBE8;
      --muted: #97A29C;
      --line: #333C38;
      --accent: #55A89E;
      --accent-ink: #0E1513;
      --gain: #5FB88D;
      --gain-soft: #1E3A2C;
      --spend: #DD8171;
      --spend-soft: #422520;
      --coin: #D8AF3C;
      --coin-soft: #3A311A;
      --water: #7396C7;
      --water-soft: #22334A;
      --chop: #C97795;
      --mine: #C2A244;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #131816;
    --surface: #1C2220;
    --surface-2: #242B28;
    --ink: #E6EBE8;
    --muted: #97A29C;
    --line: #333C38;
    --accent: #55A89E;
    --accent-ink: #0E1513;
    --gain: #5FB88D;
    --gain-soft: #1E3A2C;
    --spend: #DD8171;
    --spend-soft: #422520;
    --coin: #D8AF3C;
    --coin-soft: #3A311A;
    --water: #7396C7;
    --water-soft: #22334A;
    --chop: #C97795;
    --mine: #C2A244;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
  :root[data-theme="light"] {
    --ground: #EFF1EC;
    --surface: #FCFDFB;
    --surface-2: #F2F5F1;
    --ink: #1E2422;
    --muted: #5D6763;
    --line: #D4DAD4;
    --accent: #2F7A72;
    --accent-ink: #F2F8F6;
    --gain: #2A7350;
    --gain-soft: #DDEBE2;
    --spend: #C05B4D;
    --spend-soft: #F4E2DE;
    --coin: #A98014;
    --coin-soft: #F1E8CE;
    --water: #4A6FA5;
    --water-soft: #DFE7F2;
    --chop: #A34A6B;
    --mine: #8A6D1C;
    --shadow: 0 1px 3px rgba(30, 36, 34, 0.10);
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }

  /* ---- Header ---- */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }

  .views { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .views button {
    border: 0; background: transparent; border-radius: 8px; padding: 6px 10px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .views button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* ---- Round banner ---- */
  .banner {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .banner .round { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
  .banner .who { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .banner .netline { font-size: 13px; font-weight: 600; opacity: 0.92; text-align: right; font-variant-numeric: tabular-nums; }

  .player-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .player-tabs button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .player-tabs button[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .sec-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 8px;
  }
  .sec-label small { font-weight: 600; letter-spacing: 0.02em; text-transform: none; }

  .phase-strip {
    font-size: 12px; color: var(--muted); margin-bottom: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px;
  }
  .phase-strip b { color: var(--accent); font-variant-numeric: tabular-nums; }

  .season-note {
    background: var(--coin-soft); color: var(--ink); border: 1px solid var(--coin);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
  }

  /* ---- Task board ---- */
  .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .task-card {
    position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    border-top: 3px solid var(--task-color, var(--accent));
    padding: 0 0 10px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .task-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(30,36,34,0.16); }
  .task-card:active { transform: scale(0.97); }
  .task-card svg { width: 100%; height: 84px; display: block; }
  .task-card .tname { font-size: 14px; font-weight: 800; letter-spacing: 0.02em; }
  .task-card .tsub { font-size: 11px; color: var(--muted); padding: 0 8px 2px; text-align: center; }

  /* scene animations — hover teases, click plays */
  .bobber { transition: transform 0.3s ease; }
  .task-card:hover .bobber { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  .waves { animation: drift 6s linear infinite; }
  @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-24px); } }
  .fishy { opacity: 0; }
  .task-card.playing .fishy { animation: leap 0.9s ease-out; }
  @keyframes leap {
    0% { opacity: 0; transform: translate(6px, 16px) rotate(20deg); }
    35% { opacity: 1; transform: translate(-2px, -14px) rotate(-15deg); }
    70% { opacity: 1; transform: translate(-12px, 2px) rotate(-50deg); }
    100% { opacity: 0; transform: translate(-16px, 20px) rotate(-70deg); }
  }
  .axe { transform-origin: 78% 70%; transition: transform 0.2s ease; }
  .task-card:hover .axe { transform: rotate(-14deg); }
  .task-card.playing .axe { animation: chopswing 0.5s ease-in-out 2; }
  @keyframes chopswing { 0%,100% { transform: rotate(-14deg);} 55% { transform: rotate(18deg);} }
  .task-card.playing .chip { animation: chipfly 0.7s ease-out 0.15s both; }
  @keyframes chipfly { 0% { opacity: 0; transform: translate(0,0);} 20% {opacity:1;} 100% { opacity: 0; transform: translate(-14px,-18px) rotate(80deg);} }
  .pick { transform-origin: 70% 75%; transition: transform 0.2s ease; }
  .task-card:hover .pick { transform: rotate(-12deg) translateY(-2px); }
  .task-card.playing .pick { animation: strike 0.5s ease-in-out 2; }
  @keyframes strike { 0%,100% { transform: rotate(-12deg);} 55% { transform: rotate(16deg) translateY(3px);} }
  .task-card.playing .spark { animation: sparkle 0.6s ease-out 0.2s both; }
  @keyframes sparkle { 0% { opacity: 0; transform: scale(0.4);} 35% { opacity: 1;} 100% { opacity: 0; transform: scale(1.6) translateY(-8px);} }
  .can { transform-origin: 30% 60%; transition: transform 0.2s ease; }
  .task-card:hover .can { transform: rotate(-16deg); }
  .task-card.playing .can { animation: pour 1s ease-in-out; }
  @keyframes pour { 0%,100% { transform: rotate(0);} 30%,70% { transform: rotate(-24deg);} }
  .drop { opacity: 0; }
  .task-card.playing .drop { animation: dripping 0.5s ease-in 0.25s 2; }
  @keyframes dripping { 0% { opacity: 0; transform: translateY(0);} 30% { opacity: 1;} 100% { opacity: 0; transform: translateY(12px);} }
  .sprout { transform-origin: 50% 100%; }
  .task-card.playing .sprout { animation: grow 0.9s ease-out 0.4s both; }
  @keyframes grow { 0% { transform: scale(1); } 60% { transform: scale(1.25); } 100% { transform: scale(1.15); } }

  /* ---- Flow panel ---- */
  .flow-panel {
    background: var(--surface); border: 2px solid var(--flow-color, var(--accent)); border-radius: 14px;
    padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .flow-panel .q { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
  .flow-panel .rule { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .flow-panel .cancel {
    margin-top: 10px; width: 100%; border: 0; background: none; color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 8px;
  }
  .loc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .loc-grid button {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    padding: 12px 10px; font-size: 14px; font-weight: 700; min-height: 56px; text-align: center;
    position: relative;
  }
  .loc-grid button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .loc-grid button.locked { opacity: 0.45; }
  .use-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .use-grid button {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    padding: 12px 10px; font-size: 14px; font-weight: 700; min-height: 52px; text-align: center;
    animation: lightup 0.45s ease both;
  }
  .use-grid button:nth-child(2) { animation-delay: 0.06s; }
  .use-grid button:nth-child(3) { animation-delay: 0.12s; }
  .use-grid button:nth-child(4) { animation-delay: 0.18s; }
  @keyframes lightup {
    0% { opacity: 0.3; transform: scale(0.96); box-shadow: none; }
    60% { opacity: 1; transform: scale(1.03); box-shadow: 0 0 0 3px var(--gain-soft); }
    100% { opacity: 1; transform: scale(1); box-shadow: none; }
  }
  .use-grid button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .use-grid .wide { grid-column: 1 / -1; border-style: dashed; animation-delay: 0.24s; }

  /* ---- Gained this round: lit while in hand, black & white once used ---- */
  .gained-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .gained-chip {
    border: 1.5px solid var(--res-color, var(--accent)); background: var(--surface); border-radius: 12px;
    padding: 7px 12px; font-size: 13px; font-weight: 700; min-height: 44px;
    display: inline-flex; align-items: center; gap: 8px; text-align: left;
    transition: filter 0.5s ease, opacity 0.5s ease, transform 0.15s ease;
  }
  .gained-chip .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--res-color, var(--accent)); flex: none; }
  .gained-chip small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
  .gained-chip.lit {
    animation: lightup 0.45s ease both;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--res-color, var(--accent)) 22%, transparent);
  }
  .gained-chip.lit:hover { transform: translateY(-2px); }
  .gained-chip.used { filter: grayscale(1); opacity: 0.5; cursor: default; }
  .gained-chip.target { animation: beckon 0.9s ease-in-out infinite; }
  @keyframes beckon {
    0%,100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--res-color, var(--accent)) 22%, transparent); }
    50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--res-color, var(--accent)) 38%, transparent); transform: translateY(-2px); }
  }

  /* ---- Can-do board: options light up when currently possible ---- */
  .cando-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cando {
    border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
    padding: 11px 10px; font-size: 13px; font-weight: 700; min-height: 56px; text-align: center;
    transition: filter 0.5s ease, opacity 0.5s ease, transform 0.15s ease, box-shadow 0.3s ease;
  }
  .cando small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .cando.lit { border-color: var(--cando-color, var(--accent)); color: var(--cando-color, var(--accent));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--cando-color, var(--accent)) 16%, transparent); }
  .cando.lit:hover { transform: translateY(-2px); }
  .cando.dim { filter: grayscale(1); opacity: 0.45; cursor: default; }
  .num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .num-grid button {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    min-height: 48px; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--coin);
  }
  .num-grid button.listed {
    border-color: var(--coin);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--coin) 25%, transparent);
    animation: lightup 0.45s ease both;
  }
  .stamp-preview { display: grid; gap: 2px; justify-content: center; padding: 6px 0 2px; }
  .stamp-preview .pv { width: 18px; height: 18px; border-radius: 3px; background: transparent; }
  .stamp-preview .pv.on { border: 1px solid rgba(0,0,0,0.25); }

  /* ---- Dice ---- */
  .dice-stage { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 10px 0 14px; }
  .die {
    width: 64px; height: 64px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
  }
  .die.black { background: #23272B; color: #F2F3F4; border: 2px solid #101214; }
  .die.white { background: #F7F7F2; color: #23272B; border: 2px solid #D8D8D0; }
  .die.rolling { animation: tumble 0.82s ease-in-out; }
  @keyframes tumble {
    0% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(200deg) translateY(-16px) scale(1.06); }
    50% { transform: rotate(390deg) translateY(2px); }
    75% { transform: rotate(560deg) translateY(-8px); }
    100% { transform: rotate(720deg) translateY(0); }
  }
  .roll-btn {
    display: block; width: 100%; border: 0; background: var(--flow-color, var(--accent)); color: var(--accent-ink);
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 800;
  }
  .dice-legend { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ---- Fishing grid ---- */
  .fish-grid { border-collapse: collapse; margin: 0 auto; }
  .fish-grid th { font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 4px; font-variant-numeric: tabular-nums; }
  .fish-grid td { padding: 2px; }
  .cellb {
    width: 52px; height: 44px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); font-size: 10px; font-weight: 700; line-height: 1.15;
    padding: 2px; overflow: hidden; color: var(--muted);
  }
  .cellb.hit {
    border-color: var(--water); color: var(--ink); background: var(--water-soft);
    animation: lightup 0.4s ease both; cursor: pointer;
  }
  .cellb.caught { text-decoration: line-through; opacity: 0.4; cursor: default; }
  .cellb:disabled { cursor: default; }
  .override { margin-top: 8px; width: 100%; border: 0; background: none; color: var(--water); font-size: 12px; font-weight: 700; padding: 6px; }

  /* ---- Catch splash ---- */
  .catch-splash { text-align: center; padding: 18px 0 10px; }
  .catch-splash svg { width: 120px; height: 80px; }
  .catch-splash .fishy2 { animation: leap2 1s ease-out both; }
  @keyframes leap2 {
    0% { opacity: 0; transform: translate(30px, 40px) rotate(30deg); }
    45% { opacity: 1; transform: translate(0px, -12px) rotate(-10deg); }
    100% { opacity: 1; transform: translate(-4px, 6px) rotate(-4deg); }
  }
  .catch-splash .caughtname { font-size: 17px; font-weight: 800; margin-top: 4px; animation: lightup 0.5s ease 0.45s both; }
  .catch-splash .sub { font-size: 12px; color: var(--muted); }

  /* ---- Sheet replica design system (paper stays paper in both themes) ---- */
  .sheet {
    background: #F7F7F2; color: #15161A; border: 2px solid #15161A; border-radius: 12px;
    padding: 10px; overflow-x: auto; box-shadow: var(--shadow);
  }
  .sheet-cols { display: grid; gap: 10px; align-items: start; }
  .sheet-cols.four { grid-template-columns: repeat(4, minmax(225px, 1fr)); min-width: 960px; }
  .sheet-cols.two { grid-template-columns: minmax(430px, 1.05fr) minmax(360px, 1fr); min-width: 820px; }
  .sbox { border: 2px solid #15161A; border-radius: 9px; background: #FFFFFF; margin-bottom: 10px; overflow: hidden; }
  .sbox > h3 {
    background: #D9D9D4; color: #15161A; padding: 4px 8px;
    font-family: ui-monospace, "Cascadia Mono", "Roboto Mono", Menlo, monospace;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .sbox > h3 .hact { font-size: 11px; white-space: nowrap; }
  .sbox .bd { padding: 7px 8px; font-size: 11px; line-height: 1.35; color: #15161A; }
  .sbox .bd p { margin: 0 0 4px; }
  .snote {
    background: #15161A; color: #F7F7F2; font-size: 10px; font-weight: 600;
    border-radius: 6px; padding: 3px 8px; display: inline-block; margin: 2px 0;
  }
  .ic {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 4px; flex: none;
    font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    border: 1px solid rgba(0,0,0,0.35);
  }
  .ic.dashed { background: #fff !important; border: 1.5px dashed #15161A; color: #15161A; text-shadow: none; }
  .ic.art { background: none; border: 0; text-shadow: none; width: 19px; height: 19px; }
  .ic.art img { width: 100%; height: 100%; object-fit: contain; }
  .pond td button img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .pond td button.nix { border-style: dashed; color: #B9C4C0; cursor: default; }
  .cost-row {
    display: flex; align-items: center; gap: 3px; padding: 3px 2px; border-radius: 6px;
    cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-size: 11px;
    transition: opacity 0.3s ease;
  }
  .cost-row:hover { background: rgba(0,0,0,0.05); }
  .cost-row .arr { font-size: 10px; margin: 0 1px; color: #15161A; }
  .cost-row.done { opacity: 0.45; }
  .cost-row.done .ic { position: relative; }
  .cost-row.done .strike { text-decoration: line-through; }
  .cost-row .ok { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--gain); opacity: 0; transform: scale(0.5); transition: all 0.25s ease; }
  .cost-row.done .ok { opacity: 1; transform: scale(1); }
  .sgrid-cell { background: #FFFFFF; border: 1px solid #15161A; }
  .lvl-track { display: flex; gap: 2px; padding: 4px 2px 2px; }
  .lvl-track button {
    flex: 1; min-width: 0; border: 1.5px dashed #9C8AA5; border-radius: 4px; background: #EFE7F2;
    padding: 3px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    opacity: 0.55; transition: opacity 0.3s ease, box-shadow 0.3s ease;
  }
  .lvl-track.gold button { border-color: #C2A244; background: #F6EED3; }
  .lvl-track button .tdot { width: 11px; height: 11px; border-radius: 3px; background: var(--t-color, #999); border: 1px solid rgba(0,0,0,0.3); }
  .lvl-track button .tn { font-size: 8px; font-weight: 700; color: #15161A; font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .lvl-track button.reached { opacity: 1; border-style: solid; }
  .lvl-track button.at { box-shadow: 0 0 0 2px color-mix(in srgb, var(--t-color, #333) 45%, transparent); }
  .pond { border-collapse: collapse; margin: 2px auto; }
  .pond th { font-family: ui-monospace, monospace; font-size: 10px; background: #15161A; color: #fff; width: 18px; height: 18px; text-align: center; border-radius: 3px; }
  .pond th.blank { background: none; }
  .pond td button {

  .harvest-btn {

  }

  .growth-row .rmp { border: 0; background: none; color: #C05B4D; font-size: 13px; padding: 2px 4px; }
  .tickall {

  }
  .energy-circles { display: flex; gap: 10px; justify-content: space-around; padding: 4px 0; }

  .energy-circles button {
    width: 40px; height: 40px; border-radius: 50%; border: 1.5px dashed #15161A; background: #fff;

  }

  .energy-circles button.spent { border-style: solid; background: repeating-linear-gradient(45deg, #fff, #fff 3px, #ddd 3px, #ddd 6px); opacity: 0.6; }
  .nbtrack { display: flex; gap: 2px; align-items: center; padding: 3px 0; }
  .nbtrack button {
    flex: 1; min-width: 0; aspect-ratio: 0.8; border: 1.5px dashed #15161A; border-radius: 4px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    opacity: 0.6; transition: all 0.25s ease; padding: 1px;
  }
  .nbtrack button.got { opacity: 1; border-style: solid; background: #FDF3F3; box-shadow: 0 0 0 1.5px rgba(214,79,79,0.3); }
  .nbtrack button .tn { font-size: 7px; font-family: ui-monospace, monospace; font-weight: 700; color: #15161A; }
  .badge-box { border: 1.5px dashed #15161A; border-radius: 8px; padding: 5px 6px; margin-bottom: 7px; }
  .badge-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .badge-head .bicon {
    width: 26px; height: 34px; border: 2px solid #15161A; border-radius: 13px; background: #fff; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.3s ease;
  }

  .badge-head .bn { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; text-transform: uppercase; }
  .badge-head .bvp { margin-left: auto; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; background: #15161A; color: #fff; border-radius: 4px; padding: 1px 5px; }
  .badge-row { display: flex; align-items: center; gap: 3px; padding: 2px 0; }
  .badge-row .medal {
    margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px dashed #B85C38;
    display: flex; align-items: center; justify-content: center; font-size: 9px; color: #B85C38;
    opacity: 0.5; transition: all 0.3s ease; background: none; padding: 0;

  .badge-row .gcell {

  }

  .rtrack .tube {

    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  }

  .rtrack .tube .num {
    font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 700; text-align: center;
    padding: 2px 0; color: #15161A; border-top: 1.5px solid #15161A;
  }

  .rtrack .tube.now .fillp { background: color-mix(in srgb, var(--tube-c) 45%, #fff); animation: pulse-t 1.4s ease-in-out infinite; }
  @keyframes pulse-t { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .num .tube-num { }
  .score-strip { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .score-strip .slabel { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; color: #6B6F6D; text-transform: uppercase; }
  .score-strip input {
    width: 100%; min-width: 0; border: 1.5px solid #15161A; border-radius: 6px; background: #fff; color: #15161A;
    padding: 5px 4px; font-size: 13px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums;
  }
  .score-strip .op { font-weight: 900; font-size: 13px; }
  .score-strip .sum {
    border: 2px solid #15161A; border-radius: 6px; background: #15161A; color: #fff;
    padding: 5px 8px; font-size: 13px; font-weight: 800; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .type-legend { display: flex; gap: 6px; align-items: center; justify-content: center; border: 1.5px solid #15161A; border-radius: 6px; padding: 3px 6px; margin-bottom: 6px; font-size: 10px; font-weight: 700; color: #15161A; }
  .sheet .farm-grid .cell, .sheet .cargo-grid .cell { background: #FFFFFF; border: 1px solid #8A918D; color: #15161A; border-radius: 2px; }
  .sheet .farm-grid .cell.till { background: #DDEBE2; color: #2A7350; }
  .sheet .farm-grid .cell.fence { background: #E7E7E2; color: #15161A; }
  .sheet .farm-grid .cell.filled, .sheet .cargo-grid .cell.filled { border-color: rgba(0,0,0,0.4); }
  .sheet .cargo-grid .cell.stall-b { border-left: 2px dashed #15161A; }
  .sheet .row-rewards .rr { border-color: #8A918D; color: #8A918D; }
  .sheet .stall-inputs input { background: #fff; color: #15161A; border: 1.5px solid #15161A; font-family: ui-monospace, monospace; }
  .sheet .manifest { border: 2px solid #15161A; border-radius: 8px; padding: 5px; background: #fff; }

  /* ---- Farm sheet ---- */
  .farm-wrap { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; box-shadow: var(--shadow); overflow-x: auto; }
  .farm-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; min-width: 300px; }
  .farm-grid .cell {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2);
    padding: 0; min-width: 0; font-size: 13px; font-weight: 800; color: var(--muted); line-height: 1;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .farm-grid .cell:active { transform: scale(0.9); }
  .farm-grid .cell.absent { visibility: hidden; pointer-events: none; }
  .farm-grid .cell.filled { border-color: transparent; }
  .farm-grid .cell.till { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
  .farm-grid .cell.fence { color: var(--ink); background: color-mix(in srgb, var(--ink) 10%, var(--surface-2)); }
  .track { display: flex; gap: 3px; margin-top: 6px; }
  .track button {
    flex: 1; min-width: 0; border: 1.5px dashed var(--line); border-radius: 6px; padding: 4px 0 3px;
    background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 3px;
    filter: grayscale(0.9); opacity: 0.6; transition: filter 0.3s ease, opacity 0.3s ease;
  }
  .track button .tdot { width: 12px; height: 12px; border-radius: 50%; background: var(--t-color, var(--muted)); }
  .track button .tn { font-size: 9px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .track button.reached { filter: none; opacity: 1; border-style: solid; }
  .track button.at { border-color: var(--t-color, var(--accent));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--t-color, var(--accent)) 30%, transparent); }
  .track-label { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
  .track-label .tl { font-size: 13px; font-weight: 800; }
  .track-label .tv { font-size: 12px; color: var(--muted); }
  .energy-row { display: flex; gap: 10px; margin-top: 6px; }
  .energy-row button {
    flex: 1; border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px; background: var(--surface-2);
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .energy-row button.unlocked { border-style: solid; border-color: var(--spend); color: var(--spend); filter: none; }
  .energy-row button.spent { border-style: solid; text-decoration: line-through; opacity: 0.5; }
  .counter-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .counter-row .cl { flex: 1; font-size: 13px; font-weight: 600; }
  .counter-row .cl small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .counter-row .cv { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
  .counter-row button { width: 40px; min-height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: 17px; font-weight: 700; }

  /* ---- Cargo manifest ---- */
  .palette { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .palette button {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 6px 11px; font-size: 12px; font-weight: 700; min-height: 36px;
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
  }
  .palette button .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--res-color, var(--muted)); }
  .palette button.on { border-color: var(--res-color, var(--ink)); color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--res-color, var(--ink)) 20%, transparent); }
  .manifest-wrap { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; box-shadow: var(--shadow); overflow-x: auto; }
  .manifest { display: flex; gap: 6px; align-items: stretch; }
  .cargo-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; flex: 1; min-width: 300px; }
  .cargo-grid .cell {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2);
    padding: 0; min-width: 0; transition: background 0.15s ease, transform 0.1s ease;
  }
  .cargo-grid .cell:active { transform: scale(0.9); }
  .cargo-grid .cell.filled { border-color: transparent; }
  .cargo-grid .cell.stall-b { border-left: 2px dashed var(--muted); border-radius: 0 3px 3px 0; }
  .row-rewards { display: flex; flex-direction: column; gap: 2px; justify-content: space-between; }
  .row-rewards .rr {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 26px; border-radius: 6px; border: 1px dashed var(--line);
    font-size: 11px; font-weight: 800; color: var(--muted);
    filter: grayscale(1); opacity: 0.5; transition: filter 0.4s ease, opacity 0.4s ease;
  }
  .row-rewards .rr.done { filter: none; opacity: 1; border-style: solid;
    color: var(--rr-color, var(--accent)); border-color: var(--rr-color, var(--accent));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--rr-color, var(--accent)) 22%, transparent); }
  .stall-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .stall-inputs input {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px;
    background: var(--surface-2); font-size: 12px; font-weight: 700; text-align: center;
  }
  .cargo-note { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* ---- Coins ---- */
  .coin-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    border-top: 3px solid var(--coin);
    padding: 12px 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 14px;
  }
  .coin-card .label { font-size: 13px; font-weight: 700; }
  .coin-card .sub { font-size: 12px; color: var(--muted); }
  .coin-card .n {
    font-size: 34px; font-weight: 800; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; color: var(--coin); margin-left: auto;
    transition: transform 0.2s ease;
  }
  .coin-card .btns { display: flex; gap: 8px; }
  .coin-card .btns button {
    width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
    font-size: 20px; font-weight: 700; background: var(--surface-2);
  }
  .coin-card .minus { color: var(--spend); }
  .coin-card .plus { color: var(--gain); }

  .program-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .program-row button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 10px; font-size: 13px; font-weight: 700; min-height: 52px; color: var(--coin);
  }
  .program-row button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .program-row button:disabled { opacity: 0.45; cursor: default; }

  /* ---- Resource chips ---- */
  .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 420px) { .res-grid { grid-template-columns: repeat(3, 1fr); } }
  .res-chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    border-top: 3px solid var(--res-color, var(--accent));
    padding: 8px 6px 10px; min-height: 56px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform 0.15s ease;
  }
  .res-chip:hover { transform: translateY(-2px); }
  .res-chip:active { transform: scale(0.96); }
  .res-chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--res-color, var(--accent)); }
  .res-chip .nm { font-size: 12px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }

  /* ---- Action logger ---- */
  .action-row { display: flex; gap: 8px; }
  .action-row input {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; background: var(--surface); font-size: 14px;
  }
  .action-row button {
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 10px; padding: 0 18px; font-weight: 700; min-height: 44px;
  }

  /* ---- Ledger ---- */
  .ledger { display: flex; flex-direction: column; gap: 6px; }
  .entry {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 14px;
  }
  .entry .tag {
    flex: none; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .entry .tag.gain { background: var(--gain-soft); color: var(--gain); }
  .entry .tag.spend { background: var(--spend-soft); color: var(--spend); }
  .entry .tag.coin { background: var(--coin-soft); color: var(--coin); }
  .entry .tag.act { background: var(--surface-2); color: var(--muted); }
  .entry .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .entry .sub { color: var(--muted); font-size: 12px; }
  .entry .del { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 6px; line-height: 1; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  .ledger-tools { display: flex; gap: 8px; margin-top: 10px; }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-weight: 600;
  }
  .btn-ghost:disabled { opacity: 0.45; cursor: default; }

  /* ---- End round bar ---- */
  .endbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--ground) 65%, transparent);
    pointer-events: none;
  }
  .endbar button {
    pointer-events: auto; display: block; width: 100%; max-width: 608px; margin: 0 auto;
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; letter-spacing: 0.01em;
    box-shadow: 0 4px 14px rgba(30, 36, 34, 0.25);
  }
  .endbar button:active { transform: scale(0.98); }

  /* ---- History ---- */
  .hist-turn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .hist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .hist-head .t { font-weight: 800; font-size: 15px; }
  .hist-head .r { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .hist-line { font-size: 14px; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .hist-line .d { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; min-width: 44px; }
  .hist-line .d.gain { color: var(--gain); }
  .hist-line .d.spend { color: var(--spend); }
  .hist-line .d.coin { color: var(--coin); }
  .hist-line .d.act { color: var(--muted); font-weight: 600; }
  .hist-line .sub { color: var(--muted); font-size: 12px; }

  /* ---- Score ---- */
  .score-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .score-card h2 { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .score-card h2 .total { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--accent); }
  .score-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .score-row label { flex: 1; font-size: 13px; }
  .score-row label small { display: block; color: var(--muted); font-size: 11px; }
  .score-row input {
    width: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    background: var(--surface-2); font-size: 15px; font-weight: 700; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .leader { border-color: var(--coin); border-width: 2px; }

  /* ---- Setup ---- */
  .setup-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .setup-card h2 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .setup-card .hint { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .setup-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .setup-row input[type="text"] {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; background: var(--surface); font-size: 14px;
  }
  .setup-row .swatch {

  // ---- Mutations ----

  function gainResource(resId, use, extra) {
    var p = activePlayer();
    var e = { id: uid(), playerId: p.id, kind: "gain", resId: resId, use: use };
    if (UI.pending && UI.pending.detail) e.detail = UI.pending.detail;
    if (UI.pending && UI.pending.catchMeta) {
      e.loc = UI.pending.catchMeta.loc;
      e.cell = UI.pending.catchMeta.cell;
      caughtSet(p.id, e.loc).push(e.cell); // burn the square only once the use is committed
    }
    if (use === "sell") { e.coins = extra || 0; addCoins(p.id, e.coins); }
    if (use === "gift") { e.side = extra; }
    S.ledger.push(e);
    var detail = UI.pending ? UI.pending.detail : e.detail;
    UI.pending = null;
    if (use === "cargo") armStamp(resId, detail);
    save(); render();
  }

  // Jump to the cargo sheet with the good's manifest shape ready to place
  function armStamp(resId, detail) {
    S.view = "cargo";
    UI.brush = resId;
    var comm = commissaryInfo(resId, detail);
    UI.stamp = comm.shape ? { resId: resId, shape: comm.shape, rot: 0, flip: false } : null;
  }

  // Shape offsets after flip + rotation, normalized to start at 0,0
  function stampCells(shapeKey, rot, flip) {
    var pts = SHAPES[shapeKey].map(function (p) { return [p[0], p[1]]; });
    if (flip) {
      var maxC0 = Math.max.apply(null, pts.map(function (p) { return p[1]; }));
      pts = pts.map(function (p) { return [p[0], maxC0 - p[1]]; });
    }
    for (var i = 0; i < (rot % 4); i++) {
      var maxR = Math.max.apply(null, pts.map(function (p) { return p[0]; }));
      pts = pts.map(function (p) { return [p[1], maxR - p[0]]; });
    }
    var minR = Math.min.apply(null, pts.map(function (p) { return p[0]; }));
    var minC = Math.min.apply(null, pts.map(function (p) { return p[1]; }));
    return pts.map(function (p) { return [p[0] - minR, p[1] - minC]; });
  }

  function logTask(label) {
    label = label.trim();
    if (!label) return;
    var p = activePlayer();
    S.ledger.push({ id: uid(), playerId: p.id, kind: "task", label: label });
    save(); render();
  }

  function adjustCoins(delta) {
    var p = activePlayer();
    if (delta < 0 && coins(p.id) <= 0) return;
    addCoins(p.id, delta);
    S.ledger.push({ id: uid(), playerId: p.id, kind: "coin", delta: delta });
    save(); render();
  }

  function removeEntry(eid) {
    for (var i = S.ledger.length - 1; i >= 0; i--) {
      if (S.ledger[i].id === eid) {
        var e = S.ledger[i];
        if (e.kind === "gain" && e.use === "sell") addCoins(e.playerId, -e.coins);
        if (e.kind === "gain" && e.bought) { // refund the purchase, restore the single-use project
          addCoins(e.playerId, e.bought.cost);
          delete projectsOf(e.playerId)[e.bought.key];
        }
        if (e.kind === "coin") {
          addCoins(e.playerId, -e.delta);
          if (e.progKey) projectsOf(e.playerId)[e.progKey] = false; // restore the single-use project
        }
        if (e.loc && e.cell) { // un-catch the fishing square
          var set = caughtSet(e.playerId, e.loc);
          var ix = set.indexOf(e.cell);
          if (ix >= 0) set.splice(ix, 1);
        }
        S.ledger.splice(i, 1);
        break;
      }
    }
    save(); render();
  }

  function undo() {
    var e = S.ledger[S.ledger.length - 1];
    if (e) removeEntry(e.id);
  }

  // A held item is resolved in place: same ledger entry, its use filled in
  function resolveHold(entryId, use, extra) {
    for (var i = 0; i < S.ledger.length; i++) {
      if (S.ledger[i].id === entryId) {
        var e = S.ledger[i];
        e.use = use;
        if (use === "sell") { e.coins = extra || 0; addCoins(e.playerId, e.coins); }
        if (use === "gift") { e.side = extra; }
        if (use === "cargo") armStamp(e.resId, e.detail);
        break;
      }
    }
    UI.pending = null;
    save(); render();
  }

  function entryText(e) {
    // Denormalized description used for both ledger display and history snapshots
    if (e.kind === "task") return { tag: "Task", cls: "act", txt: e.label };
    if (e.kind === "coin") {
      var coinTxt = e.label || (e.delta > 0 ? "Coins adjusted" : "Coins spent");
      return e.delta > 0
        ? { tag: "+" + e.delta + " coin" + (e.delta === 1 ? "" : "s"), cls: "coin", txt: coinTxt }
        : { tag: "−" + (-e.delta) + " coin" + (e.delta === -1 ? "" : "s"), cls: "coin", txt: coinTxt };
    }
    var r = resource(e.resId);
    var name = r ? r.name : "Resource";
    if (e.detail) name = e.detail + " (" + name + ")";
    if (e.use === "crack") return { tag: "Cracked", cls: "spend", txt: name + " → cracked open on the Geode card" };
    if (e.use === "hold") {
      return e.bought
        ? { tag: "Held", cls: "gain", txt: name + " → bought (−" + e.bought.cost + "c), in hand" }
        : { tag: "Held", cls: "gain", txt: name + " → in hand, not yet used" };
    }
    if (e.use === "sell") return { tag: "+" + e.coins + " coins", cls: "coin", txt: name + " → sold to commissary" };
    if (e.use === "cargo") return { tag: "Cargo", cls: "gain", txt: name + " → cargo manifest" };
    if (e.use === "gift") return { tag: "Gift", cls: "gain", txt: name + " → gifted to " + (e.side || "a") + " neighbor" };
    return { tag: "Spent", cls: "spend", txt: name + " → spent on sheet" };
  }

  function endRound() {
    var entries = S.ledger.map(function (e) {
      var t = entryText(e);
      return { tag: t.tag, cls: t.cls, txt: t.txt, byName: (player(e.playerId) || {}).name || "?" };
    });
    S.history.unshift({ round: S.round, season: season(S.round), entries: entries });
    S.ledger = [];
    UI.flow = null;
    UI.pending = null;
    UI.chooseUse = null;
    if (S.round >= ROUNDS) { S.over = true; }
    else { S.round++; }
    save(); render();
    window.scrollTo(0, 0);
  }

  // ---- Fishing helpers ----

  function rollDie() { return DIE_FACES[Math.floor(Math.random() * DIE_FACES.length)]; }
  function faceMatches(face, index1based) { return face === "W" || face === index1based; }
  function eligibleCells(loc, dice, rodUpgrade, pid) {
    var out = {};
    for (var r = 1; r <= 5; r++) {
      for (var c = 1; c <= 5; c++) {
        if (faceMatches(dice[0], r) && faceMatches(dice[1], c)) out[r + "," + c] = true;
      }
    }
    if (rodUpgrade) {
      // PLACEHOLDER: "Upgraded Rod modifies catch area" — modeled as +1 orthogonal reach
      var extra = {};
      Object.keys(out).forEach(function (k) {
        var p = k.split(",");
        var r0 = +p[0], c0 = +p[1];
        [[r0 - 1, c0], [r0 + 1, c0], [r0, c0 - 1], [r0, c0 + 1]].forEach(function (n) {
          if (n[0] >= 1 && n[0] <= 5 && n[1] >= 1 && n[1] <= 5) extra[n[0] + "," + n[1]] = true;
        });
      });
      Object.keys(extra).forEach(function (k) { out[k] = true; });
    }
    Object.keys(out).forEach(function (k) {
      var p = k.split(",");
      if (isCaught(pid, loc.key, +p[0], +p[1])) delete out[k];
    });
    return out;
  }

    h += "</div>";
    h += "</div></div>";

    // Round tracker synced to the game
    h += '<div class="sbox"><h3>Round Tracker</h3><div class="bd"><div class="rtrack">';
    for (var rt = 1; rt <= 12; rt++) {
      var tubeC = rt <= 5 ? "#8CC152" : rt <= 9 ? "#F0B429" : "#E8663C";

      h += '<div class="' + cls2 + '" style="--tube-c:' + tubeC + '"><div class="fillp"></div><div class="num">' + (rt < 10 ? "0" : "") + rt + "</div></div>";

  function renderPlay() {
    var p = activePlayer();
    var gained = 0, coinsIn = 0, coinsOut = 0, tasks = 0;
    S.ledger.forEach(function (e) {
      if (e.playerId !== p.id) return;
      if (e.kind === "gain") { gained++; if (e.use === "sell") coinsIn += e.coins; }
      else if (e.kind === "task") tasks++;
      else if (e.kind === "coin") { if (e.delta > 0) coinsIn += e.delta; else coinsOut -= e.delta; }
    });

    var h = "";
    if (S.over) {
      h += '<div class="banner"><div><div class="round">Game complete</div>' +
        '<div class="who">All 12 rounds played</div></div>' +
        '<div class="netline">Tally up on the<br>Score tab</div></div>';
    } else {
      h += '<div class="banner">' +
        '<div><div class="round">Round ' + S.round + " of " + ROUNDS + " · Season " + season(S.round) + "</div>" +
        '<div class="who">' + esc(p.name) + "</div></div>" +
        '<div class="netline">' + gained + " gained · " + tasks + (tasks === 1 ? " task" : " tasks") +
        "<br>+" + coinsIn + " / −" + coinsOut + " coins</div>" +
        "</div>";
      if (S.round === 6 || S.round === 10) {
        h += '<div class="season-note">Scoring phase: score the Season ' + (season(S.round) - 1) + " objective at the start of this round.</div>";
      } else if (S.round === 12) {
        h += '<div class="season-note">Final round — afterwards, score the Season 3 objective and run final scoring on the Score tab.</div>';
      }
      h += '<div class="phase-strip">Round phases: <b>1</b> Neighbor &middot; <b>2</b> Scoring &middot; <b>3</b> Setup &middot; <b>4</b> Growth &middot; <b>5</b> Task</div>';
    }

    if (S.players.length > 1) {
      h += '<div class="player-tabs" role="tablist">';
      S.players.forEach(function (pl) {
        h += '<button role="tab" aria-current="' + (pl.id === S.activePlayer ? "true" : "false") +
          '" data-act="pick-player" data-id="' + pl.id + '">' + esc(pl.name) + " · " + coins(pl.id) + "c</button>";
      });
      h += "</div>";
    }

    // Active flow panel (task wizard), or the pending resource-use panel
    if (UI.flow) h += renderFlow(p);
    else if (UI.pending) h += renderUsePanel();

    // Gained this round: every gain stays visible — lit while in hand, black & white once used
    var gains = S.ledger.filter(function (e) { return e.kind === "gain" && e.playerId === p.id; });
    var heldCount = 0;
    gains.forEach(function (e) { if (e.use === "hold") heldCount++; });
    if (gains.length) {
      var gLabel = UI.chooseUse
        ? "Pick which resource to " + USES[UI.chooseUse].label.toLowerCase()
        : 'Gained this round <small>&mdash; lit = in hand, tap to use</small>';
      h += '<div class="sec-label">' + gLabel + '</div><div class="gained-row">';
      gains.forEach(function (e) {
        var r = resource(e.resId);
        var nm = e.detail || (r ? r.name : "Resource");
        var isHeld = e.use === "hold";
        var sub;
        if (isHeld) sub = "in hand";
        else if (e.use === "sell") sub = "sold +" + e.coins + "c";
        else if (e.use === "cargo") sub = "→ cargo";
        else if (e.use === "gift") sub = "→ gift " + (e.side === "left" ? "L" : "R");
        else sub = "→ sheet";
        var cls = "gained-chip " + (isHeld ? "lit" : "used") + (isHeld && UI.chooseUse ? " target" : "");
        h += '<button class="' + cls + '" style="--res-color:' + esc(r ? r.color : "#888") + '"' +
          (isHeld ? ' data-act="gained-chip" data-id="' + e.id + '"' : " disabled") + ">" +
          '<span class="dot"></span><span>' + esc(nm) + "<small>" + esc(sub) + "</small></span></button>";
      });
      h += "</div>";
    }

    // Can-do board: what is possible right now, given what's in hand and coins
    var canP = coins(p.id) >= 3;
    function cando(use, color, subWhenDim) {
      var lit = heldCount > 0;
      return '<button class="cando ' + (lit ? "lit" : "dim") + '" style="--cando-color:' + color + '"' +
        (lit ? ' data-act="cando" data-use="' + use + '"' : " disabled") + ">" +
        USES[use].label + "<small>" + (lit ? USES[use].sub : subWhenDim) + "</small></button>";
    }
    h += '<div class="sec-label">What you can do now</div><div class="cando-grid">';
    h += cando("spend", "var(--spend)", "needs a resource in hand");
    h += cando("sell", "var(--coin)", "needs a resource in hand");
    h += cando("cargo", "var(--gain)", "needs a resource in hand");
    h += cando("gift", "var(--accent)", "needs a resource in hand");
    h += '<button class="cando ' + (canP ? "lit" : "dim") + '" style="--cando-color:var(--coin)" data-act="program" data-kind="intern"' + (canP ? "" : " disabled") + ">Intern Program &minus;3<small>" + (canP ? "take any 1 main task" : "needs 3 coins") + "</small></button>";
    h += '<button class="cando ' + (canP ? "lit" : "dim") + '" style="--cando-color:var(--coin)" data-act="program" data-kind="buyback"' + (canP ? "" : " disabled") + ">Buyback Program &minus;3<small>" + (canP ? "cross out any 1 good" : "needs 3 coins") + "</small></button>";
    h += "</div>";

    // Single-use coin purchases from the Projects panel of the cargo sheet
    var proj = projectsOf(p.id);
    h += '<div class="sec-label">Buy goods <small>&mdash; single use each, from your projects panel</small></div><div class="cando-grid">';
    BUY_PROJECTS.forEach(function (bp) {
      var res = resourceByName(bp.name);
      var used = !!proj[bp.key];
      var afford = coins(p.id) >= bp.cost;
      var lit = !used && afford;
      var sub = used ? "used" : (afford ? "gain 1 " + bp.name : "needs " + bp.cost + " coin" + (bp.cost === 1 ? "" : "s"));
      h += '<button class="cando ' + (lit ? "lit" : "dim") + '" style="--cando-color:' + esc(res ? res.color : "var(--coin)") + '"' +
        (lit ? ' data-act="buy-project" data-key="' + bp.key + '"' : " disabled") + ">" +
        esc(bp.name) + " &minus;" + bp.cost + "<small>" + esc(sub) + "</small></button>";
    });
    h += "</div>";

    h += '<div class="sec-label">Take a task</div><div class="task-grid">';
    h += taskCardHtml("fish", "Fish", "roll the dice, pick your catch", "var(--water)");
    h += taskCardHtml("chop", "Chop", "scratch off a Woods square", "var(--chop)");
    h += taskCardHtml("mine", "Mine", "scratch off a Mines square", "var(--mine)");
    h += taskCardHtml("tend", "Tend", "farm actions: plant, water, animals", "var(--accent)");
    h += "</div>";

    h += '<div class="sec-label">Coins</div>';
    h += '<div class="coin-card"><div><div class="label">Coins on hand</div>' +
      '<div class="sub">From commissary sales; spend on sheet costs</div></div>' +
      '<div class="n">' + coins(p.id) + "</div>" +
      '<div class="btns"><button class="minus" data-act="coins" data-delta="-1" aria-label="Spend one coin">&minus;</button>' +
      '<button class="plus" data-act="coins" data-delta="1" aria-label="Gain one coin">+</button></div></div>';

    h += '<div class="sec-label">Gained something else? <small>&mdash; neighbor rewards, geodes, trades</small></div>';
    h += '<div class="res-grid">';
    S.resources.forEach(function (r) {
      h += '<button class="res-chip" style="--res-color:' + esc(r.color) + '" data-act="gain" data-id="' + r.id + '">' +
        '<span class="dot"></span><span class="nm">' + esc(r.name) + "</span></button>";
    });
    h += "</div>";

    h += '<div class="sec-label">Log a note</div>';
    h += '<div class="action-row">' +
      '<input id="actionInput" type="text" placeholder="e.g. Built fence, used energy bar" aria-label="Action description">' +
      '<button data-act="log-task">Log</button></div>';

    h += '<div class="sec-label">This round&rsquo;s ledger</div><div class="ledger">';
    var shown = 0;
    for (var i = S.ledger.length - 1; i >= 0; i--) {
      var e = S.ledger[i];
      var by = player(e.playerId);
      var byNote = (by && by.id !== p.id) ? ' <span class="sub">(' + esc(by.name) + ")</span>" : "";
      var t = entryText(e);
      h += '<div class="entry"><span class="tag ' + t.cls + '">' + esc(t.tag) + '</span><span class="txt">' + esc(t.txt) + byNote + "</span>" +
        '<button class="del" data-act="remove-entry" data-id="' + e.id + '" aria-label="Delete entry">&times;</button></div>';
      shown++;
    }
    if (!shown) h += '<div class="empty">Nothing yet &mdash; take a task above, or tap a resource when you gain one.</div>';
    h += "</div>";
    h += '<div class="ledger-tools"><button class="btn-ghost" data-act="undo"' + (S.ledger.length ? "" : " disabled") + ">Undo last</button></div>";

    app.innerHTML = h;
  }

  function taskCardHtml(kind, name, sub, color) {
    return '<button class="task-card" id="task-' + kind + '" style="--task-color:' + color + '" data-act="task" data-kind="' + kind + '">' +
      taskArt(kind) +
      '<span class="tname">' + name + '</span><span class="tsub">' + sub + "</span></button>";
  }

  function renderUsePanel() {
    var pr = resource(UI.pending.resId);
    var prName = UI.pending.detail || (pr ? pr.name : "Resource");
    var comm = commissaryInfo(UI.pending.resId, UI.pending.detail);
    var h = "";
    if (UI.pending.step === "sell") {
      var isFish = pr && pr.name === "Fish" && !comm.value;
      var sellRule;
      if (isFish) {
        sellRule = "The commissary's fish rows pay 1–4 coins by species — check the placard for this one.";
      } else if (comm.value) {
        sellRule = "Commissary listed price: " + comm.value + " coin" + (comm.value === 1 ? "" : "s") +
          (comm.unv ? " (read through glare — verify on the placard)" : ".");
      } else {
        sellRule = "Check its coin value on the Corporate Commissary board.";
      }
      h += '<div class="flow-panel"><div class="q">' + esc(prName) + " sold — for how many coins?</div>" +
        '<div class="rule">' + sellRule + '</div><div class="num-grid">';
      for (var c = 1; c <= 8; c++) {
        var listed = !isFish && comm.value === c && !comm.unv;
        h += '<button' + (listed ? ' class="listed"' : "") + ' data-act="sell-coins" data-n="' + c + '">' + c + "</button>";
      }
      h += '</div><button class="cancel" data-act="cancel-pending">Cancel</button></div>';
    } else if (UI.pending.step === "gift") {
      h += '<div class="flow-panel"><div class="q">' + esc(prName) + " gifted — to which neighbor?</div>" +
        '<div class="rule">Mark the bonus on that side’s neighbor rewards track.</div>' +
        '<div class="use-grid">' +
        '<button data-act="gift-side" data-side="left">Left neighbor</button>' +
        '<button data-act="gift-side" data-side="right">Right neighbor</button>' +
        '</div><button class="cancel" data-act="cancel-pending">Cancel</button></div>';
    } else {
      var resolving = !!UI.pending.entryId;
      var noSell = comm.value === null, noCargo = comm.shape === null;
      h += '<div class="flow-panel"><div class="q">' + esc(prName) + (resolving ? " — how are you using it?" : " gained — how are you using it?") + "</div>" +
        '<div class="rule">The rulebook says resources are used immediately — but hold it if you want to decide in a moment.</div>' +
        '<div class="use-grid">' +
        '<button data-act="use" data-use="spend">' + USES.spend.label + "<small>" + USES.spend.sub + "</small></button>" +
        (noSell
          ? '<button class="dim" disabled style="filter:grayscale(1);opacity:0.45">' + USES.sell.label + "<small>can&rsquo;t be sold</small></button>"
          : '<button data-act="use" data-use="sell">' + USES.sell.label + "<small>" + (comm.value ? "listed: " + comm.value + "c" : USES.sell.sub) + "</small></button>") +
        (noCargo
          ? '<button class="dim" disabled style="filter:grayscale(1);opacity:0.45">' + USES.cargo.label + "<small>can&rsquo;t be placed</small></button>"
          : '<button data-act="use" data-use="cargo">' + USES.cargo.label + "<small>" + USES.cargo.sub + "</small></button>") +
        '<button data-act="use" data-use="gift">' + USES.gift.label + "<small>" + USES.gift.sub + "</small></button>" +
        (pr && pr.name === "Geode" ? '<button class="wide" data-act="use" data-use="crack" style="border-style:solid;color:var(--mine)">Crack it open<small>roll 2 dice on the Geode card — gain an item</small></button>' : "") +
        (resolving ? "" : '<button class="wide" data-act="use" data-use="hold">Hold onto it<small>keep it in hand, decide later this round</small></button>') +
        '</div><button class="cancel" data-act="cancel-pending">' + (resolving ? "Keep holding" : "Cancel") + "</button></div>";
    }
    return h;
  }

  function renderFlow(p) {
    var f = UI.flow;
    var h = "";

    if (f.task === "fish") {
      var color = "var(--water)";
      if (f.step === "location") {
        h += '<div class="flow-panel" style="--flow-color:' + color + '"><div class="q">Where are you fishing?</div>' +
          '<div class="rule">Locked locations open via unlocks on the Setup tab.</div><div class="loc-grid">';
        var u = unlocks(p.id);
        FISH_LOCATIONS.forEach(function (loc) {
          var locked = loc.key !== "basic" && !u[loc.key];
          h += '<button class="' + (locked ? "locked" : "") + '" data-act="fish-loc" data-loc="' + loc.key + '"' + (locked ? " disabled" : "") + ">" +
            esc(loc.name) + "<small>" + (locked ? "🔒 " : "") + esc(loc.sub) + "</small></button>";
        });
        h += '</div><button class="cancel" data-act="cancel-flow">Cancel</button></div>';
      } else if (f.step === "roll") {
        var loc = fishLocation(f.loc);
        h += '<div class="flow-panel" style="--flow-color:' + color + '"><div class="q">' + esc(loc.name) + " — roll the dice</div>" +
          '<div class="rule">Black die = row, white die = column. The Tend icon (✦) is wild.</div>' +
          '<div class="dice-stage">' +
          '<div class="die black' + (f.rolling ? " rolling" : "") + '">' + (f.dice ? dieFace(f.dice[0]) : "?") + "</div>" +
          '<div class="die white' + (f.rolling ? " rolling" : "") + '">' + (f.dice ? dieFace(f.dice[1]) : "?") + "</div>" +
          "</div>" +
          '<button class="roll-btn" data-act="fish-roll"' + (f.rolling ? " disabled" : "") + ">" + (f.rolling ? "Rolling…" : "Roll") + "</button>" +
          '<div class="dice-legend">Rolled real dice at the table? Roll here anyway or pick any square next.</div>' +
          '<button class="cancel" data-act="cancel-flow">Cancel</button></div>';
      } else if (f.step === "pick") {
        var loc2 = fishLocation(f.loc);
        var u2 = unlocks(p.id);
        var elig = f.anySquare ? null : eligibleCells(loc2, f.dice, !!u2.rod, p.id);
        h += '<div class="flow-panel" style="--flow-color:' + color + '"><div class="q">' + esc(loc2.name) + " — " + dieFace(f.dice[0]) + " · " + dieFace(f.dice[1]) + "</div>" +
          '<div class="rule">' + (f.anySquare ? "Manual override: pick any uncaught square." :
            (u2.rod ? "Upgraded rod: matching squares plus adjacent ones are lit." : "Pick a lit square to catch.")) + "</div>" +
          gridTableHtml(loc2.key, p.id, elig, f.anySquare, "fish-pick");
        if (!f.anySquare) h += '<button class="override" data-act="fish-any">Pick any square (manual override)</button>';
        h += '<button class="cancel" data-act="fish-reroll">Re-roll</button>' +
          '<button class="cancel" data-act="cancel-flow">Cancel</button></div>';
      } else if (f.step === "caught") {
        h += '<div class="flow-panel" style="--flow-color:' + color + '"><div class="catch-splash">' +
          '<svg viewBox="0 0 120 80" aria-hidden="true">' +
          '<path d="M0 62 q15 -8 30 0 t30 0 t30 0 t30 0 v18 h-120 z" fill="var(--water)" opacity="0.45"/>' +
          '<g class="fishy2"><path d="M34 40 q16 -14 34 0 q-16 14 -34 0 z" fill="var(--water)"/>' +
          '<path d="M68 40 l14 -9 v18 z" fill="var(--water)"/><circle cx="42" cy="37" r="2.4" fill="#fff"/></g>' +
          "</svg>" +
          '<div class="caughtname">' + esc(f.caughtName) + "!</div>" +
          '<div class="sub">Use it now, or hold it in hand for this round.</div></div></div>';
      }
    }

    if (f.task === "geode") {
      var gcolor = "var(--mine)";
      if (f.step === "roll") {
        h += '<div class="flow-panel" style="--flow-color:' + gcolor + '"><div class="q">Crack the geode — roll the dice</div>' +
          '<div class="rule">Obtained from the mines. Roll 2 dice; ✦ are wild. Gain an item.</div>' +
          '<div class="dice-stage">' +
          '<div class="die black' + (f.rolling ? " rolling" : "") + '">' + (f.dice ? dieFace(f.dice[0]) : "?") + "</div>" +
          '<div class="die white' + (f.rolling ? " rolling" : "") + '">' + (f.dice ? dieFace(f.dice[1]) : "?") + "</div>" +
          "</div>" +
          '<button class="roll-btn" data-act="geode-roll"' + (f.rolling ? " disabled" : "") + ">" + (f.rolling ? "Rolling…" : "Roll") + "</button>" +
          '<button class="cancel" data-act="cancel-flow">Cancel</button></div>';
      } else if (f.step === "pick") {
        var gelig = f.anySquare ? null : eligibleCells({ key: "geode" }, f.dice, false, p.id);
        h += '<div class="flow-panel" style="--flow-color:' + gcolor + '"><div class="q">Geode — ' + dieFace(f.dice[0]) + " · " + dieFace(f.dice[1]) + "</div>" +
          '<div class="rule">Pick a lit square to gain that item.</div>' +
          gridTableHtml("geode", p.id, gelig, f.anySquare, "geode-pick");
        if (!f.anySquare) h += '<button class="override" data-act="fish-any">Pick any square (manual override)</button>';
        h += '<button class="cancel" data-act="geode-reroll">Re-roll</button>' +
          '<button class="cancel" data-act="cancel-flow">Cancel</button></div>';
      }
    }

    if (f.task === "chop" || f.task === "mine") {
      var isChop = f.task === "chop";
      var tcolor = isChop ? "var(--chop)" : "var(--mine)";
      var fs = farmOf(p.id);
      var lvl = isChop ? fs.chopLvl : fs.mineLvl;
      var yieldItem = (isChop ? CHOP_TRACK : MINE_TRACK)[lvl - 1];
      h += '<div class="flow-panel" style="--flow-color:' + tcolor + '"><div class="q">' + (isChop ? "Chop — the Woods" : "Mine — the Mines") + "</div>" +
        '<div class="rule">Scratch off a square from the top (1 action) or bottom (2 actions) of your card. Your level ' + lvl + " yield:</div>" +
        '<button class="roll-btn" data-act="flow-track-gain" data-task="' + f.task + '">Gain ' + esc(yieldItem.n) + " (level " + lvl + ")</button>" +
        '<div class="rule" style="margin-top:10px">&hellip;or tap whatever you actually revealed:</div>' +
        '<div class="res-grid">';
      S.resources.forEach(function (r) {
        h += '<button class="res-chip" style="--res-color:' + esc(r.color) + '" data-act="flow-gain" data-id="' + r.id + '">' +
          '<span class="dot"></span><span class="nm">' + esc(r.name) + "</span></button>";
      });
      h += '</div><button class="cancel" data-act="cancel-flow">Cancel</button></div>';
    }

    if (f.task === "tend") {
      h += '<div class="flow-panel"><div class="q">Tend — the farm</div>' +
        '<div class="rule">Plant, water, or care for animals on your farm sheet, then tap anything you gained.</div>' +
        '<div class="res-grid">';
      S.resources.forEach(function (r) {
        h += '<button class="res-chip" style="--res-color:' + esc(r.color) + '" data-act="flow-gain" data-id="' + r.id + '">' +
          '<span class="dot"></span><span class="nm">' + esc(r.name) + "</span></button>";
      });
      h += '</div>' +
        '<button class="cancel" data-act="flow-nothing">Log the task with no resource gained</button>' +
        '<button class="cancel" data-act="cancel-flow">Cancel</button></div>';
    }

    return h;
  }

  function dieFace(v) { return v === "W" ? "✦" : v; }

  // Shared 5x5 grid table for fishing locations and the geode card.
  // Geode picks don't burn squares (the card is reused for every geode).
  function gridTableHtml(locKey, pid, elig, anySquare, act) {
    var trackCaught = locKey !== "geode";
    var h = '<table class="fish-grid"><tr><th></th>';
    for (var c = 1; c <= 5; c++) h += "<th>" + c + "</th>";
    h += "</tr>";
    for (var r = 1; r <= 5; r++) {
      h += "<tr><th>" + r + "</th>";
      for (var c2 = 1; c2 <= 5; c2++) {
        var key = r + "," + c2;
        var k = gridKind(locKey, r, c2);
        var caught = trackCaught && isCaught(pid, locKey, r, c2);
        var hit = !caught && k && (anySquare || (elig && elig[key]));
        var label = k ? k.name : "+";
        var art2 = locKey === "basic" && TA && TA.pond && TA.pond[key];
        h += '<td><button class="cellb' + (hit ? " hit" : "") + (caught ? " caught" : "") + '"' +
          (hit ? ' data-act="' + act + '" data-cell="' + key + '"' : " disabled") + ">" +
          (art2 ? '<img src="' + art2 + '" alt="' + esc(label) + '" style="max-width:100%;max-height:100%">' : esc(label)) + "</button></td>";
      }
      h += "</tr>";
    }
    return h + "</table>";
  }

  function renderHistory() {
    var h = "";
    if (!S.history.length) {
      h = '<div class="empty">No finished rounds yet. End a round on the Play tab and it will be archived here.</div>';
    } else {
      S.history.forEach(function (t) {
        h += '<div class="hist-turn"><div class="hist-head"><span class="t">Round ' + t.round + "</span>" +
          '<span class="r">Season ' + t.season + "</span></div>";
        if (!t.entries.length) {
          h += '<div class="empty">No activity recorded.</div>';
        } else {
          t.entries.forEach(function (e) {
            var by = e.byName && S.players.length > 1 ? ' <span class="sub">(' + esc(e.byName) + ")</span>" : "";
            h += '<div class="hist-line"><span class="d ' + esc(e.cls) + '">' + esc(e.tag) + "</span><span>" + esc(e.txt) + by + "</span></div>";
          });
        }
        h += "</div>";
      });
    }
    app.innerHTML = h;
  }

  // Mirrors the scoring area on the cargo sheet: Obj 1-3, Stalls 1-3, Neighbor, Badges
  var SCORE_FIELDS = [
    { key: "obj1", label: "Objective 1", sub: "scored at the start of round 6" },
    { key: "obj2", label: "Objective 2", sub: "scored at the start of round 10" },
    { key: "obj3", label: "Objective 3", sub: "scored at the end of the game" },
    { key: "stall1", label: "Stall 1", sub: "cargo manifest goods points" },
    { key: "stall2", label: "Stall 2", sub: "cargo manifest goods points" },
    { key: "stall3", label: "Stall 3", sub: "cargo manifest goods points" },
    { key: "neighbor", label: "Neighbor bonuses", sub: "3 pts per extra item gifted vs. each neighbor" },
    { key: "badges", label: "Badges", sub: "incl. Seasoned Explorer doubling one badge" }
  ];

  function scoreTotal(pid) {
    var sc = S.scores[pid] || {};
    var t = 0;
    SCORE_FIELDS.forEach(function (f) { t += sc[f.key] || 0; });
    return t;
  }

  function renderScore() {
    var best = -1;
    S.players.forEach(function (pl) { best = Math.max(best, scoreTotal(pl.id)); });
    var h = '<div class="empty" style="padding-top:0">Final scoring &mdash; mirrors the scoring area on the cargo sheet.</div>';
    S.players.forEach(function (pl) {
      var total = scoreTotal(pl.id);
      var sc = S.scores[pl.id] || {};
      h += '<div class="score-card' + (S.players.length > 1 && total === best && total > 0 ? " leader" : "") + '">' +
        "<h2>" + esc(pl.name) + '<span class="total">' + total + " VP</span></h2>";
      SCORE_FIELDS.forEach(function (f) {
        h += '<div class="score-row"><label>' + f.label + "<small>" + f.sub + "</small></label>" +
          '<input type="number" inputmode="numeric" min="0" value="' + (sc[f.key] || 0) +
          '" data-act="score" data-pid="' + pl.id + '" data-field="' + f.key + '" aria-label="' + esc(pl.name + " " + f.label) + '"></div>';
      });
      h += "</div>";
    });
    app.innerHTML = h;
  }

  function renderSetup() {
    var h = "";
    var p = activePlayer();
    var u = unlocks(p.id);

    h += '<div class="setup-card"><h2>Players</h2><div class="hint">Everyone plays simultaneously in Tend &mdash; each player can also run this app on their own phone.</div>';
    S.players.forEach(function (pl) {
      h += '<div class="setup-row">' +
        '<input type="text" value="' + esc(pl.name) + '" data-act="rename-player" data-id="' + pl.id + '" aria-label="Player name">' +
        (S.players.length > 1 ? '<button class="rm" data-act="remove-player" data-id="' + pl.id + '" aria-label="Remove player">&times;</button>' : "") +
        "</div>";
    });
    h += '<button class="setup-add" data-act="add-player">+ Add player</button></div>';

    h += '<div class="setup-card"><h2>Unlocks &amp; upgrades &mdash; ' + esc(p.name) + '</h2>' +

  // ---- Events ----

  document.getElementById("viewNav").addEventListener("click", function (ev) {

  document.getElementById("endTurnBtn").addEventListener("click", endRound);

  function startFlow(kind) {
    UI.pending = null;

    else UI.flow = { task: kind, step: "gain" };
    logTaskSilent(kind);
    render();
  }
  // Record the task itself so the ledger shows "Task: Fish" even before a catch lands
  function logTaskSilent(kind) {
    var names = { fish: "Fish", chop: "Chop", mine: "Mine", tend: "Tend" };
    var p = activePlayer();
    S.ledger.push({ id: uid(), playerId: p.id, kind: "task", label: names[kind] || kind });

  }

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");

    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");

    if (act === "task") {
      var kind = b.getAttribute("data-kind");

      b.classList.add("playing");
      setTimeout(function () { startFlow(kind); }, 650);

    else if (act === "fish-loc") { UI.flow.step = "roll"; UI.flow.loc = b.getAttribute("data-loc"); UI.flow.dice = null; render(); }
    else if (act === "fish-roll") {
      UI.flow.rolling = true;
      UI.flow.dice = [rollDie(), rollDie()];
      render();
      setTimeout(function () {
        if (!UI.flow || UI.flow.task !== "fish") return;
        UI.flow.rolling = false;
        UI.flow.step = "pick";
        render();
      }, 850);
    }
    else if (act === "fish-reroll" || act === "geode-reroll") { UI.flow.step = "roll"; UI.flow.dice = null; UI.flow.anySquare = false; render(); }
    else if (act === "fish-any") { UI.flow.anySquare = true; render(); }
    else if (act === "geode-roll") {
      UI.flow.rolling = true;
      UI.flow.dice = [rollDie(), rollDie()];
      render();
      setTimeout(function () {
        if (!UI.flow || UI.flow.task !== "geode") return;
        UI.flow.rolling = false;
        UI.flow.step = "pick";
        render();
      }, 850);
    }
    else if (act === "geode-pick") {

      var gkind = gridKind("geode", +gcell[0], +gcell[1]);
      if (!gkind) return;
      var gres = findOrCreateResource(gkind.res, null);

      UI.pending = { resId: gres.id, step: "use" };
      save(); render();
    }
    else if (act === "fish-pick") {

      var pcs = cell.split(",");
      var pkind = gridKind(UI.flow.loc, +pcs[0], +pcs[1]);
      if (!pkind) return;
      UI.flow.step = "caught";
      UI.flow.caughtName = pkind.name;
      UI.flow.caughtCell = cell;
      UI.flow.caughtRes = pkind.res;

      setTimeout(function () {
        if (!UI.flow || UI.flow.step !== "caught") return;
        var cres = findOrCreateResource(UI.flow.caughtRes, null);
        UI.pending = { resId: cres.id, step: "use", detail: UI.flow.caughtName === cres.name ? null : UI.flow.caughtName };
        if (UI.flow.caughtCell) UI.pending.catchMeta = { loc: UI.flow.loc, cell: UI.flow.caughtCell };
        UI.flow = null;
        render();

    else if (act === "flow-gain") { UI.pending = { resId: id, step: "use" }; UI.flow = null; render(); }

    else if (act === "cancel-flow") { UI.flow = null; render(); }
    else if (act === "gain") { UI.flow = null; UI.pending = { resId: id, step: "use" }; render(); }
    else if (act === "gained-chip") {
      var he = null;

      UI.flow = null;
      if (UI.chooseUse) {
        var cu = UI.chooseUse;

        if (cu === "sell") UI.pending = { entryId: he.id, resId: he.resId, detail: he.detail, step: "sell" };
        else if (cu === "gift") UI.pending = { entryId: he.id, resId: he.resId, detail: he.detail, step: "gift" };
        else { resolveHold(he.id, cu); return; }

        UI.pending = { entryId: he.id, resId: he.resId, detail: he.detail, step: "use" };

    else if (act === "cando") {

      if (!heldEntries.length) return;
      UI.flow = null;
      if (heldEntries.length === 1) {
        var only = heldEntries[0];

        else if (cuse === "gift") UI.pending = { entryId: only.id, resId: only.resId, detail: only.detail, step: "gift" };
        else { resolveHold(only.id, cuse); return; }

        else gainResource(UI.pending.resId, "crack");
        UI.flow = { task: "geode", step: "roll" };
        render();

      else gainResource(UI.pending.resId, use);

    else if (act === "sell-coins") {

    else if (act === "gift-side") {

    else if (act === "cancel-pending") { UI.pending = null; UI.chooseUse = null; render(); }
    else if (act === "brush") { UI.brush = id; render(); }
    else if (act === "farm-cell") {

      } else if (br === "fence") {
        if (cur && cur.t === "fence") { if (cur.o === "h") cur.o = "v"; else delete ff.cells[fk]; }

    }
    else if (act === "bridge-row") {

      if (sproj[spk]) { // undo: restore single use, refund coins if it cost coins
        sproj[spk] = false;
        if (spk === "intern" || spk === "buyback") addCoins(spp.id, 3);
      } else {
        if (spk === "intern" || spk === "buyback") {
          if (coins(spp.id) < 3) return;
          addCoins(spp.id, -3);
          S.ledger.push({ id: uid(), playerId: spp.id, kind: "coin", delta: -3, progKey: spk,
            label: spk === "intern" ? "Intern Program — take any 1 main task" : "Buyback Program — wild good for a badge" });

          S.ledger.push({ id: uid(), playerId: activePlayer().id, kind: "gain", resId: hres.id, use: "hold" });

      var bcc = parseInt(b.getAttribute("data-c"), 10);

    else if (act === "nb") {

    else if (act === "clear-farm") {

        var anchor = ck.split(",");
        var ar = +anchor[0], ac = +anchor[1];
        var cells2 = stampCells(UI.stamp.shape, UI.stamp.rot, UI.stamp.flip);
        var fits = cells2.every(function (x) {
          var rr = ar + x[0], cc = ac + x[1];
          return rr < 8 && cc < 12 && !cg2.cells[rr + "," + cc];
        });

        cells2.forEach(function (x) { cg2.cells[(ar + x[0]) + "," + (ac + x[1])] = UI.stamp.resId; });
        UI.brush = UI.stamp.resId;

      else if (cg2.cells[ck]) delete cg2.cells[ck];
      else if (UI.brush && resource(UI.brush)) cg2.cells[ck] = UI.brush;
      else if (S.resources[0]) { UI.brush = S.resources[0].id; cg2.cells[ck] = UI.brush; }
      save(); render();

      addCoins(bpP.id, -bp.cost);

        bres = { id: uid(), name: bp.name, color: SWATCHES[S.resources.length % SWATCHES.length] };
        S.resources.push(bres);

      S.ledger.push({ id: uid(), playerId: bpP.id, kind: "gain", resId: bres.id, use: "hold",
        bought: { key: bp.key, cost: bp.cost } });
      save(); render();
    }
    else if (act === "coins") adjustCoins(parseInt(b.getAttribute("data-delta"), 10));
    else if (act === "program") {

      addCoins(p2.id, -3);
      var isIntern = b.getAttribute("data-kind") === "intern";
      S.ledger.push({ id: uid(), playerId: p2.id, kind: "coin", delta: -3,

      S.players.push({ id: uid(), name: "Player " + (S.players.length + 1) });

      delete S.caught[id];
      delete S.cargo[id];
      delete S.projects[id];

      if (S.badgeState) delete S.badgeState[id];
      S.ledger = S.ledger.filter(function (e) { return e.playerId !== id; });
      if (S.activePlayer === id) S.activePlayer = S.players[0].id;
      save(); render();
    }
    else if (act === "add-res") {
      S.resources.push({ id: uid(), name: "New resource", color: SWATCHES[S.resources.length % SWATCHES.length] });
      save(); render();
    }
    else if (act === "remove-res") {
      var r = resource(id);
      if (!confirm("Remove " + (r ? r.name : "this resource") + "?")) return;
      S.resources = S.resources.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    else if (act === "reset") {
      if (!confirm("Start a new game? Round, coins, unlocks, caught fish, ledger, history, and scores are cleared.")) return;
      S.round = 1;
      S.over = false;
      S.coins = {};
      S.unlocks = {};
      S.caught = {};
      S.cargo = {};
      S.projects = {};
      S.farm = {};
      S.badgeState = {};
      S.ledger = [];
      S.history = [];
      S.scores = {};
      S.activePlayer = S.players[0].id;
      S.view = "play";
      UI.flow = null;
      UI.pending = null;
      save(); render();
    }
  });

  app.addEventListener("change", function (ev) {
    var t = ev.target;
    var act = t.getAttribute("data-act");
    if (!act) return;
    var id = t.getAttribute("data-id");
    if (act === "rename-player") { var pl = player(id); if (pl) pl.name = t.value.trim() || pl.name; save(); render(); }
    else if (act === "rename-res") { var r = resource(id); if (r) r.name = t.value.trim() || r.name; save(); render(); }
    else if (act === "recolor-res") { var r2 = resource(id); if (r2) r2.color = t.value; save(); render(); }
    else if (act === "toggle-unlock") {
      var uk = t.getAttribute("data-key");
      unlocks(activePlayer().id)[uk] = t.checked;
      // keep the farm sheet's matching upgrade in step
      var fu0 = farmOf(activePlayer().id);
      if (uk === "rod") fu0.upg.rod = t.checked;
      if (uk === "river") fu0.upg.bridge = t.checked;
      save(); render();
    }
    else if (act === "farm-upg") {
      var fuk = t.getAttribute("data-key");
      var fu = farmOf(activePlayer().id);
      fu.upg[fuk] = t.checked;
      FARM_UPGRADES.forEach(function (u) { if (u.key === fuk && u.sync) unlocks(activePlayer().id)[u.sync] = t.checked; });
      save(); render();
    }
    else if (act === "stall-label") { cargoOf(activePlayer().id).stalls[parseInt(t.getAttribute("data-idx"), 10)] = t.value; save(); }
    else if (act === "score") {
      var pid = t.getAttribute("data-pid"), field = t.getAttribute("data-field");
      if (!S.scores[pid]) S.scores[pid] = {};
      var v = parseInt(t.value, 10);
      S.scores[pid][field] = isNaN(v) ? 0 : Math.max(0, v);
      save(); render();
    }
  });

  app.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "actionInput") {
      logTask(ev.target.value);
    }
  });

  render();
})();
</script>
</body>
</html>
