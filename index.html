<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tend Turn Companion</title>
<style>
  :root {
    --ground: #EFF1EC;
    --surface: #FCFDFB;
    --surface-2: #F2F5F1;
    --ink: #1E2422;
    --muted: #5D6763;
    --line: #D4DAD4;
    --accent: #2F7A72;
    --accent-ink: #F2F8F6;
    --gain: #2A7350;
    --gain-soft: #DDEBE2;
    --spend: #C05B4D;
    --spend-soft: #F4E2DE;
    --coin: #A98014;
    --coin-soft: #F1E8CE;
    --shadow: 0 1px 3px rgba(30, 36, 34, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131816;
      --surface: #1C2220;
      --surface-2: #242B28;
      --ink: #E6EBE8;
      --muted: #97A29C;
      --line: #333C38;
      --accent: #55A89E;
      --accent-ink: #0E1513;
      --gain: #5FB88D;
      --gain-soft: #1E3A2C;
      --spend: #DD8171;
      --spend-soft: #422520;
      --coin: #D8AF3C;
      --coin-soft: #3A311A;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #131816;
    --surface: #1C2220;
    --surface-2: #242B28;
    --ink: #E6EBE8;
    --muted: #97A29C;
    --line: #333C38;
    --accent: #55A89E;
    --accent-ink: #0E1513;
    --gain: #5FB88D;
    --gain-soft: #1E3A2C;
    --spend: #DD8171;
    --spend-soft: #422520;
    --coin: #D8AF3C;
    --coin-soft: #3A311A;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
  :root[data-theme="light"] {
    --ground: #EFF1EC;
    --surface: #FCFDFB;
    --surface-2: #F2F5F1;
    --ink: #1E2422;
    --muted: #5D6763;
    --line: #D4DAD4;
    --accent: #2F7A72;
    --accent-ink: #F2F8F6;
    --gain: #2A7350;
    --gain-soft: #DDEBE2;
    --spend: #C05B4D;
    --spend-soft: #F4E2DE;
    --coin: #A98014;
    --coin-soft: #F1E8CE;
    --shadow: 0 1px 3px rgba(30, 36, 34, 0.10);
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }

  /* ---- Header ---- */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }

  .views { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .views button {
    border: 0; background: transparent; border-radius: 8px; padding: 6px 10px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .views button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* ---- Round banner ---- */
  .banner {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .banner .round { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
  .banner .who { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .banner .netline { font-size: 13px; font-weight: 600; opacity: 0.92; text-align: right; font-variant-numeric: tabular-nums; }

  .player-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .player-tabs button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .player-tabs button[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .sec-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 8px;
  }
  .sec-label small { font-weight: 600; letter-spacing: 0.02em; text-transform: none; }

  /* ---- Coins ---- */
  .coin-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    border-top: 3px solid var(--coin);
    padding: 12px 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 14px;
  }
  .coin-card .label { font-size: 13px; font-weight: 700; }
  .coin-card .sub { font-size: 12px; color: var(--muted); }
  .coin-card .n {
    font-size: 34px; font-weight: 800; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; color: var(--coin); margin-left: auto;
  }
  .coin-card .btns { display: flex; gap: 8px; }
  .coin-card .btns button {
    width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
    font-size: 20px; font-weight: 700; background: var(--surface-2);
  }
  .coin-card .minus { color: var(--spend); }
  .coin-card .plus { color: var(--gain); }

  /* ---- Resource chips ---- */
  .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 420px) { .res-grid { grid-template-columns: 1fr 1fr; } }
  .res-chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    border-top: 3px solid var(--res-color, var(--accent));
    padding: 10px 8px 12px; min-height: 60px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .res-chip:active { transform: scale(0.97); }
  .res-chip .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--res-color, var(--accent)); }
  .res-chip .nm { font-size: 13px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }

  /* ---- Pending use panel ---- */
  .use-panel {
    background: var(--surface); border: 2px solid var(--accent); border-radius: 14px;
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .use-panel .q { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
  .use-panel .rule { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .use-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .use-grid button {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    padding: 12px 10px; font-size: 14px; font-weight: 700; min-height: 52px; text-align: center;
  }
  .use-grid button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .use-panel .cancel {
    margin-top: 10px; width: 100%; border: 0; background: none; color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 8px;
  }
  .num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .num-grid button {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    min-height: 48px; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--coin);
  }

  /* ---- Task chips ---- */
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .quick-actions button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; min-height: 40px;
  }
  .action-row { display: flex; gap: 8px; }
  .action-row input {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; background: var(--surface); font-size: 14px;
  }
  .action-row button {
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 10px; padding: 0 18px; font-weight: 700; min-height: 44px;
  }

  /* ---- Ledger ---- */
  .ledger { display: flex; flex-direction: column; gap: 6px; }
  .entry {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 14px;
  }
  .entry .tag {
    flex: none; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .entry .tag.gain { background: var(--gain-soft); color: var(--gain); }
  .entry .tag.spend { background: var(--spend-soft); color: var(--spend); }
  .entry .tag.coin { background: var(--coin-soft); color: var(--coin); }
  .entry .tag.act { background: var(--surface-2); color: var(--muted); }
  .entry .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .entry .sub { color: var(--muted); font-size: 12px; }
  .entry .del { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 6px; line-height: 1; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  .ledger-tools { display: flex; gap: 8px; margin-top: 10px; }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-weight: 600;
  }
  .btn-ghost:disabled { opacity: 0.45; cursor: default; }

  /* ---- End round bar ---- */
  .endbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--ground) 65%, transparent);
    pointer-events: none;
  }
  .endbar button {
    pointer-events: auto; display: block; width: 100%; max-width: 608px; margin: 0 auto;
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; letter-spacing: 0.01em;
    box-shadow: 0 4px 14px rgba(30, 36, 34, 0.25);
  }
  .endbar button:active { transform: scale(0.98); }

  .season-note {
    background: var(--coin-soft); color: var(--ink); border: 1px solid var(--coin);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
  }

  /* ---- History ---- */
  .hist-turn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .hist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .hist-head .t { font-weight: 800; font-size: 15px; }
  .hist-head .r { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .hist-line { font-size: 14px; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .hist-line .d { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; min-width: 44px; }
  .hist-line .d.gain { color: var(--gain); }
  .hist-line .d.spend { color: var(--spend); }
  .hist-line .d.coin { color: var(--coin); }
  .hist-line .d.act { color: var(--muted); font-weight: 600; }
  .hist-line .sub { color: var(--muted); font-size: 12px; }

  /* ---- Score ---- */
  .score-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .score-card h2 { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .score-card h2 .total { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--accent); }
  .score-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .score-row label { flex: 1; font-size: 13px; }
  .score-row label small { display: block; color: var(--muted); font-size: 11px; }
  .score-row input {
    width: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    background: var(--surface-2); font-size: 15px; font-weight: 700; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .leader { border-color: var(--coin); border-width: 2px; }

  /* ---- Setup ---- */
  .setup-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .setup-card h2 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .setup-card .hint { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .setup-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .setup-row input[type="text"] {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; background: var(--surface); font-size: 14px;
  }
  .setup-row .swatch {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    padding: 0; flex: none; background: none; overflow: hidden;
  }
  .setup-row .swatch input { width: 200%; height: 200%; transform: translate(-25%, -25%); border: 0; padding: 0; cursor: pointer; }
  .setup-row .rm { border: 0; background: none; color: var(--spend); font-size: 18px; padding: 6px; line-height: 1; flex: none; }
  .setup-add {
    border: 1px dashed var(--line); background: none; border-radius: 8px;
    padding: 9px 12px; font-size: 13px; font-weight: 600; color: var(--accent); width: 100%;
  }
  .danger {
    border: 1px solid var(--spend); color: var(--spend); background: none;
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700; width: 100%;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">IV Studio &middot; Tend</div>
      <h1>Turn Companion</h1>
    </div>
    <nav class="views" id="viewNav" aria-label="Views">
      <button data-view="play">Play</button>
      <button data-view="history">History</button>
      <button data-view="score">Score</button>
      <button data-view="setup">Setup</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="endbar" id="endbar"><button id="endTurnBtn">End round</button></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "tend-companion-v1";
  var ROUNDS = 12;
  var SWATCHES = ["#8A5A3B", "#4A6FA5", "#6E6A75", "#8E4A8B", "#5B8A3A", "#B0A38E", "#C05B4D", "#3E7C7B"];
  var USES = {
    spend: { label: "Spent on sheet", sub: "badge, upgrade, soil, fence" },
    sell:  { label: "Sold to commissary", sub: "gain its coin value" },
    cargo: { label: "Cargo manifest", sub: "fill matching boxes" },
    gift:  { label: "Gifted to neighbor", sub: "left or right track" }
  };

  function uid() { return Math.random().toString(36).slice(2, 9); }

  function defaultState() {
    var pid = uid();
    return {
      round: 1,
      over: false,
      view: "play",
      activePlayer: pid,
      players: [{ id: pid, name: "Player 1" }],
      coins: {},   // playerId -> n
      resources: [
        { id: uid(), name: "Wood", color: "#8A5A3B" },
        { id: uid(), name: "Fish", color: "#4A6FA5" },
        { id: uid(), name: "Ore", color: "#6E6A75" },
        { id: uid(), name: "Geode", color: "#8E4A8B" },
        { id: uid(), name: "Crop", color: "#5B8A3A" },
        { id: uid(), name: "Milk", color: "#B0A38E" }
      ],
      tasks: ["Tend", "Fish", "Mine", "Chop"],
      ledger: [],  // entries this round
      history: [], // archived rounds, newest first
      scores: {}   // playerId -> {s1,s2,s3,cargo,badges,explorer,neighbor}
    };
  }

  var S = load();
  var UI = { pending: null }; // {resId, step:'use'|'sell'} — not persisted

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.players && s.resources) return s;
      }
    } catch (e) { /* corrupted or unavailable storage: start fresh */ }
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function player(id) {
    for (var i = 0; i < S.players.length; i++) if (S.players[i].id === id) return S.players[i];
    return null;
  }
  function resource(id) {
    for (var i = 0; i < S.resources.length; i++) if (S.resources[i].id === id) return S.resources[i];
    return null;
  }
  function activePlayer() { return player(S.activePlayer) || S.players[0]; }
  function season(round) { return Math.min(3, Math.floor((round - 1) / 4) + 1); }
  function coins(pid) { return S.coins[pid] || 0; }
  function addCoins(pid, d) { S.coins[pid] = Math.max(0, coins(pid) + d); }

  // ---- Mutations ----

  function gainResource(resId, use, extra) {
    var p = activePlayer();
    var e = { id: uid(), playerId: p.id, kind: "gain", resId: resId, use: use };
    if (use === "sell") { e.coins = extra || 0; addCoins(p.id, e.coins); }
    if (use === "gift") { e.side = extra; }
    S.ledger.push(e);
    UI.pending = null;
    save(); render();
  }

  function logTask(label) {
    label = label.trim();
    if (!label) return;
    var p = activePlayer();
    S.ledger.push({ id: uid(), playerId: p.id, kind: "task", label: label });
    save(); render();
  }

  function adjustCoins(delta) {
    var p = activePlayer();
    if (delta < 0 && coins(p.id) <= 0) return;
    addCoins(p.id, delta);
    S.ledger.push({ id: uid(), playerId: p.id, kind: "coin", delta: delta });
    save(); render();
  }

  function removeEntry(eid) {
    for (var i = S.ledger.length - 1; i >= 0; i--) {
      if (S.ledger[i].id === eid) {
        var e = S.ledger[i];
        if (e.kind === "gain" && e.use === "sell") addCoins(e.playerId, -e.coins);
        if (e.kind === "coin") addCoins(e.playerId, -e.delta);
        S.ledger.splice(i, 1);
        break;
      }
    }
    save(); render();
  }

  function undo() {
    var e = S.ledger[S.ledger.length - 1];
    if (e) removeEntry(e.id);
  }

  function entryText(e) {
    // Denormalized description used for both ledger display and history snapshots
    if (e.kind === "task") return { tag: "Task", cls: "act", txt: e.label };
    if (e.kind === "coin") {
      return e.delta > 0
        ? { tag: "+" + e.delta + " coin" + (e.delta === 1 ? "" : "s"), cls: "coin", txt: "Coins adjusted" }
        : { tag: "−" + (-e.delta) + " coin" + (e.delta === -1 ? "" : "s"), cls: "coin", txt: "Coins spent" };
    }
    var r = resource(e.resId);
    var name = r ? r.name : "Resource";
    if (e.use === "sell") return { tag: "+" + e.coins + " coins", cls: "coin", txt: name + " → sold to commissary" };
    if (e.use === "cargo") return { tag: "Cargo", cls: "gain", txt: name + " → cargo manifest" };
    if (e.use === "gift") return { tag: "Gift", cls: "gain", txt: name + " → gifted to " + (e.side || "a") + " neighbor" };
    return { tag: "Spent", cls: "spend", txt: name + " → spent on sheet" };
  }

  function endRound() {
    var entries = S.ledger.map(function (e) {
      var t = entryText(e);
      return { tag: t.tag, cls: t.cls, txt: t.txt, byName: (player(e.playerId) || {}).name || "?" };
    });
    S.history.unshift({ round: S.round, season: season(S.round), entries: entries });
    S.ledger = [];
    UI.pending = null;
    if (S.round >= ROUNDS) { S.over = true; }
    else { S.round++; }
    save(); render();
    window.scrollTo(0, 0);
  }

  // ---- Rendering ----

  var app = document.getElementById("app");

  function render() {
    var nav = document.getElementById("viewNav");
    var btns = nav.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-current", btns[i].getAttribute("data-view") === S.view ? "true" : "false");
    }
    var endbar = document.getElementById("endbar");
    endbar.style.display = (S.view === "play" && !S.over) ? "" : "none";
    document.getElementById("endTurnBtn").textContent =
      S.round >= ROUNDS ? "End round 12 · finish game" : "End round " + S.round;
    if (S.view === "play") renderPlay();
    else if (S.view === "history") renderHistory();
    else if (S.view === "score") renderScore();
    else renderSetup();
  }

  function renderPlay() {
    var p = activePlayer();
    var gained = 0, coinsIn = 0, coinsOut = 0, tasks = 0;
    S.ledger.forEach(function (e) {
      if (e.playerId !== p.id) return;
      if (e.kind === "gain") { gained++; if (e.use === "sell") coinsIn += e.coins; }
      else if (e.kind === "task") tasks++;
      else if (e.kind === "coin") { if (e.delta > 0) coinsIn += e.delta; else coinsOut -= e.delta; }
    });

    var h = "";
    if (S.over) {
      h += '<div class="banner"><div><div class="round">Game complete</div>' +
        '<div class="who">All 12 rounds played</div></div>' +
        '<div class="netline">Tally up on the<br>Score tab</div></div>';
    } else {
      h += '<div class="banner">' +
        '<div><div class="round">Round ' + S.round + " of " + ROUNDS + " · Season " + season(S.round) + "</div>" +
        '<div class="who">' + esc(p.name) + "</div></div>" +
        '<div class="netline">' + gained + " gained · " + tasks + (tasks === 1 ? " task" : " tasks") +
        "<br>+" + coinsIn + " / −" + coinsOut + " coins</div>" +
        "</div>";
      if (!S.over && S.round % 4 === 0) {
        h += '<div class="season-note">Season ' + season(S.round) + " ends after this round — check the season objective before scoring.</div>";
      }
    }

    if (S.players.length > 1) {
      h += '<div class="player-tabs" role="tablist">';
      S.players.forEach(function (pl) {
        h += '<button role="tab" aria-current="' + (pl.id === S.activePlayer ? "true" : "false") +
          '" data-act="pick-player" data-id="' + pl.id + '">' + esc(pl.name) + " · " + coins(pl.id) + "c</button>";
      });
      h += "</div>";
    }

    h += '<div class="sec-label">Coins</div>';
    h += '<div class="coin-card"><div><div class="label">Coins on hand</div>' +
      '<div class="sub">From commissary sales; spend on sheet costs</div></div>' +
      '<div class="n">' + coins(p.id) + "</div>" +
      '<div class="btns"><button class="minus" data-act="coins" data-delta="-1" aria-label="Spend one coin">&minus;</button>' +
      '<button class="plus" data-act="coins" data-delta="1" aria-label="Gain one coin">+</button></div></div>';

    h += '<div class="sec-label">Gained a resource? <small>&mdash; tap it, then say how you used it</small></div>';

    if (UI.pending) {
      var pr = resource(UI.pending.resId);
      var prName = pr ? pr.name : "Resource";
      if (UI.pending.step === "sell") {
        h += '<div class="use-panel"><div class="q">' + esc(prName) + " sold — for how many coins?</div>" +
          '<div class="rule">Check its coin value on the Corporate Commissary board.</div><div class="num-grid">';
        for (var c = 1; c <= 8; c++) h += '<button data-act="sell-coins" data-n="' + c + '">' + c + "</button>";
        h += '</div><button class="cancel" data-act="cancel-pending">Cancel</button></div>';
      } else if (UI.pending.step === "gift") {
        h += '<div class="use-panel"><div class="q">' + esc(prName) + " gifted — to which neighbor?</div>" +
          '<div class="rule">Mark the bonus on that side’s neighbor rewards track.</div>' +
          '<div class="use-grid">' +
          '<button data-act="gift-side" data-side="left">Left neighbor</button>' +
          '<button data-act="gift-side" data-side="right">Right neighbor</button>' +
          '</div><button class="cancel" data-act="cancel-pending">Cancel</button></div>';
      } else {
        h += '<div class="use-panel"><div class="q">' + esc(prName) + " gained — how are you using it?</div>" +
          '<div class="rule">No storage in Tend: every resource must be used immediately.</div>' +
          '<div class="use-grid">' +
          '<button data-act="use" data-use="spend">' + USES.spend.label + "<small>" + USES.spend.sub + "</small></button>" +
          '<button data-act="use" data-use="sell">' + USES.sell.label + "<small>" + USES.sell.sub + "</small></button>" +
          '<button data-act="use" data-use="cargo">' + USES.cargo.label + "<small>" + USES.cargo.sub + "</small></button>" +
          '<button data-act="use" data-use="gift">' + USES.gift.label + "<small>" + USES.gift.sub + "</small></button>" +
          '</div><button class="cancel" data-act="cancel-pending">Cancel</button></div>';
      }
    }

    h += '<div class="res-grid">';
    S.resources.forEach(function (r) {
      h += '<button class="res-chip" style="--res-color:' + esc(r.color) + '" data-act="gain" data-id="' + r.id + '">' +
        '<span class="dot"></span><span class="nm">' + esc(r.name) + "</span></button>";
    });
    h += "</div>";

    h += '<div class="sec-label">Log a task or action</div>';
    if (S.tasks.length) {
      h += '<div class="quick-actions">';
      S.tasks.forEach(function (a, i) {
        h += '<button data-act="quick" data-idx="' + i + '">' + esc(a) + "</button>";
      });
      h += "</div>";
    }
    h += '<div class="action-row">' +
      '<input id="actionInput" type="text" placeholder="e.g. Watered crops, built fence" aria-label="Action description">' +
      '<button data-act="log-task">Log</button></div>';

    h += '<div class="sec-label">This round&rsquo;s ledger</div><div class="ledger">';
    var shown = 0;
    for (var i = S.ledger.length - 1; i >= 0; i--) {
      var e = S.ledger[i];
      var by = player(e.playerId);
      var byNote = (by && by.id !== p.id) ? ' <span class="sub">(' + esc(by.name) + ")</span>" : "";
      var t = entryText(e);
      h += '<div class="entry"><span class="tag ' + t.cls + '">' + esc(t.tag) + '</span><span class="txt">' + esc(t.txt) + byNote + "</span>" +
        '<button class="del" data-act="remove-entry" data-id="' + e.id + '" aria-label="Delete entry">&times;</button></div>';
      shown++;
    }
    if (!shown) h += '<div class="empty">Nothing yet &mdash; tap a resource when you gain one, or log a task.</div>';
    h += "</div>";
    h += '<div class="ledger-tools"><button class="btn-ghost" data-act="undo"' + (S.ledger.length ? "" : " disabled") + ">Undo last</button></div>";

    app.innerHTML = h;
  }

  function renderHistory() {
    var h = "";
    if (!S.history.length) {
      h = '<div class="empty">No finished rounds yet. End a round on the Play tab and it will be archived here.</div>';
    } else {
      S.history.forEach(function (t) {
        h += '<div class="hist-turn"><div class="hist-head"><span class="t">Round ' + t.round + "</span>" +
          '<span class="r">Season ' + t.season + "</span></div>";
        if (!t.entries.length) {
          h += '<div class="empty">No activity recorded.</div>';
        } else {
          t.entries.forEach(function (e) {
            var by = e.byName && S.players.length > 1 ? ' <span class="sub">(' + esc(e.byName) + ")</span>" : "";
            h += '<div class="hist-line"><span class="d ' + esc(e.cls) + '">' + esc(e.tag) + "</span><span>" + esc(e.txt) + by + "</span></div>";
          });
        }
        h += "</div>";
      });
    }
    app.innerHTML = h;
  }

  var SCORE_FIELDS = [
    { key: "s1", label: "Season 1 objective", sub: "season scoring at end of season 1" },
    { key: "s2", label: "Season 2 objective", sub: "season scoring at end of season 2" },
    { key: "s3", label: "Season 3 objective", sub: "season scoring at end of season 3" },
    { key: "cargo", label: "Cargo Manifest stalls", sub: "stalls 1, 2 and 3 goods points" },
    { key: "badges", label: "Badges", sub: "points for each badge earned" },
    { key: "explorer", label: "Seasoned Explorer", sub: "doubles one badge’s points" },
    { key: "neighbor", label: "Neighbor bonuses", sub: "3 pts per extra item gifted vs. neighbor" }
  ];

  function scoreTotal(pid) {
    var sc = S.scores[pid] || {};
    var t = 0;
    SCORE_FIELDS.forEach(function (f) { t += sc[f.key] || 0; });
    return t;
  }

  function renderScore() {
    var best = -1;
    S.players.forEach(function (pl) { best = Math.max(best, scoreTotal(pl.id)); });
    var h = '<div class="empty" style="padding-top:0">Final scoring &mdash; the five ways to earn victory points in Tend. Fill in each player&rsquo;s totals.</div>';
    S.players.forEach(function (pl) {
      var total = scoreTotal(pl.id);
      var sc = S.scores[pl.id] || {};
      h += '<div class="score-card' + (S.players.length > 1 && total === best && total > 0 ? " leader" : "") + '">' +
        "<h2>" + esc(pl.name) + '<span class="total">' + total + " VP</span></h2>";
      SCORE_FIELDS.forEach(function (f) {
        h += '<div class="score-row"><label>' + f.label + "<small>" + f.sub + "</small></label>" +
          '<input type="number" inputmode="numeric" min="0" value="' + (sc[f.key] || 0) +
          '" data-act="score" data-pid="' + pl.id + '" data-field="' + f.key + '" aria-label="' + esc(pl.name + " " + f.label) + '"></div>';
      });
      h += "</div>";
    });
    app.innerHTML = h;
  }

  function renderSetup() {
    var h = "";

    h += '<div class="setup-card"><h2>Players</h2><div class="hint">Everyone plays simultaneously in Tend &mdash; add the players sharing this device.</div>';
    S.players.forEach(function (pl) {
      h += '<div class="setup-row">' +
        '<input type="text" value="' + esc(pl.name) + '" data-act="rename-player" data-id="' + pl.id + '" aria-label="Player name">' +
        (S.players.length > 1 ? '<button class="rm" data-act="remove-player" data-id="' + pl.id + '" aria-label="Remove player">&times;</button>' : "") +
        "</div>";
    });
    h += '<button class="setup-add" data-act="add-player">+ Add player</button></div>';

    h += '<div class="setup-card"><h2>Resources</h2>' +
      '<div class="hint">The goods you gain from tending, fishing, mining, and chopping. Rename or add to match the cards in play.</div>';
    S.resources.forEach(function (r) {
      h += '<div class="setup-row">' +
        '<span class="swatch"><input type="color" value="' + esc(r.color) + '" data-act="recolor-res" data-id="' + r.id + '" aria-label="Color for ' + esc(r.name) + '"></span>' +
        '<input type="text" value="' + esc(r.name) + '" data-act="rename-res" data-id="' + r.id + '" aria-label="Resource name">' +
        '<button class="rm" data-act="remove-res" data-id="' + r.id + '" aria-label="Remove resource">&times;</button>' +
        "</div>";
    });
    h += '<button class="setup-add" data-act="add-res">+ Add resource</button></div>';

    h += '<div class="setup-card"><h2>Quick tasks</h2>' +
      '<div class="hint">One-tap buttons for the tasks you take in a round. Tend, Fish, Mine, and Chop are the four main tasks.</div>';
    S.tasks.forEach(function (a, i) {
      h += '<div class="setup-row">' +
        '<input type="text" value="' + esc(a) + '" data-act="rename-task" data-idx="' + i + '" aria-label="Task name">' +
        '<button class="rm" data-act="remove-task" data-idx="' + i + '" aria-label="Remove task">&times;</button>' +
        "</div>";
    });
    h += '<button class="setup-add" data-act="add-task">+ Add task</button></div>';

    h += '<div class="setup-card"><h2>Game</h2>' +
      '<div class="hint">Resets to round 1 and clears coins, the ledger, history, and scores. Players, resources, and tasks are kept.</div>' +
      '<button class="danger" data-act="reset">Start a new game</button></div>';

    app.innerHTML = h;
  }

  // ---- Events ----

  document.getElementById("viewNav").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-view]");
    if (!b) return;
    S.view = b.getAttribute("data-view");
    save(); render();
  });

  document.getElementById("endTurnBtn").addEventListener("click", endRound);

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b || b.tagName === "INPUT") return;
    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");
    var idx = parseInt(b.getAttribute("data-idx"), 10);

    if (act === "gain") { UI.pending = { resId: id, step: "use" }; render(); }
    else if (act === "use") {
      var use = b.getAttribute("data-use");
      if (use === "sell") { UI.pending.step = "sell"; render(); }
      else if (use === "gift") { UI.pending.step = "gift"; render(); }
      else gainResource(UI.pending.resId, use);
    }
    else if (act === "sell-coins") gainResource(UI.pending.resId, "sell", parseInt(b.getAttribute("data-n"), 10));
    else if (act === "gift-side") gainResource(UI.pending.resId, "gift", b.getAttribute("data-side"));
    else if (act === "cancel-pending") { UI.pending = null; render(); }
    else if (act === "coins") adjustCoins(parseInt(b.getAttribute("data-delta"), 10));
    else if (act === "pick-player") { S.activePlayer = id; UI.pending = null; save(); render(); }
    else if (act === "quick") logTask(S.tasks[idx] || "");
    else if (act === "log-task") logTask(document.getElementById("actionInput").value);
    else if (act === "remove-entry") removeEntry(id);
    else if (act === "undo") undo();
    else if (act === "add-player") {
      S.players.push({ id: uid(), name: "Player " + (S.players.length + 1) });
      save(); render();
    }
    else if (act === "remove-player") {
      if (S.players.length <= 1) return;
      var pl = player(id);
      if (!confirm("Remove " + (pl ? pl.name : "this player") + "? Their coins and scores are discarded.")) return;
      S.players = S.players.filter(function (x) { return x.id !== id; });
      delete S.coins[id];
      delete S.scores[id];
      S.ledger = S.ledger.filter(function (e) { return e.playerId !== id; });
      if (S.activePlayer === id) S.activePlayer = S.players[0].id;
      save(); render();
    }
    else if (act === "add-res") {
      S.resources.push({ id: uid(), name: "New resource", color: SWATCHES[S.resources.length % SWATCHES.length] });
      save(); render();
    }
    else if (act === "remove-res") {
      var r = resource(id);
      if (!confirm("Remove " + (r ? r.name : "this resource") + "?")) return;
      S.resources = S.resources.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    else if (act === "add-task") { S.tasks.push("New task"); save(); render(); }
    else if (act === "remove-task") { S.tasks.splice(idx, 1); save(); render(); }
    else if (act === "reset") {
      if (!confirm("Start a new game? Round, coins, ledger, history, and scores are cleared.")) return;
      S.round = 1;
      S.over = false;
      S.coins = {};
      S.ledger = [];
      S.history = [];
      S.scores = {};
      S.activePlayer = S.players[0].id;
      S.view = "play";
      UI.pending = null;
      save(); render();
    }
  });

  app.addEventListener("change", function (ev) {
    var t = ev.target;
    var act = t.getAttribute("data-act");
    if (!act) return;
    var id = t.getAttribute("data-id");
    var idx = parseInt(t.getAttribute("data-idx"), 10);
    if (act === "rename-player") { var pl = player(id); if (pl) pl.name = t.value.trim() || pl.name; save(); render(); }
    else if (act === "rename-res") { var r = resource(id); if (r) r.name = t.value.trim() || r.name; save(); render(); }
    else if (act === "recolor-res") { var r2 = resource(id); if (r2) r2.color = t.value; save(); render(); }
    else if (act === "rename-task") { S.tasks[idx] = t.value.trim() || S.tasks[idx]; save(); render(); }
    else if (act === "score") {
      var pid = t.getAttribute("data-pid"), field = t.getAttribute("data-field");
      if (!S.scores[pid]) S.scores[pid] = {};
      var v = parseInt(t.value, 10);
      S.scores[pid][field] = isNaN(v) ? 0 : Math.max(0, v);
      save(); render();
    }
  });

  app.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "actionInput") {
      logTask(ev.target.value);
    }
  });

  render();
})();
</script>
</body>
</html>
