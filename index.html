  // ---- Events ----

  document.getElementById("viewNav").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-view]");
    if (!b) return;
    S.view = b.getAttribute("data-view");
    save(); render();
  });

  document.getElementById("endTurnBtn").addEventListener("click", endRound);

  function startFlow(kind) {
    UI.pending = null;
    UI.chooseUse = null;
    if (kind === "fish") UI.flow = { task: "fish", step: "location" };
    else UI.flow = { task: kind, step: "gain" };
    logTaskSilent(kind);
    render();
  }
  // Record the task itself so the ledger shows "Task: Fish" even before a catch lands
  function logTaskSilent(kind) {
    var names = { fish: "Fish", chop: "Chop", mine: "Mine", tend: "Tend" };
    var p = activePlayer();
    S.ledger.push({ id: uid(), playerId: p.id, kind: "task", label: names[kind] || kind });
    save();
  }

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b || b.tagName === "INPUT") return;
    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");

    if (act === "task") {
      var kind = b.getAttribute("data-kind");
      // play the card's scene animation, then open the flow
      b.classList.add("playing");
      setTimeout(function () { startFlow(kind); }, 650);
      return;
    }
    else if (act === "fish-loc") { UI.flow.step = "roll"; UI.flow.loc = b.getAttribute("data-loc"); UI.flow.dice = null; render(); }
    else if (act === "fish-roll") {
      UI.flow.rolling = true;
      UI.flow.dice = [rollDie(), rollDie()];
      render();
      setTimeout(function () {
        if (!UI.flow || UI.flow.task !== "fish") return;
        UI.flow.rolling = false;
        UI.flow.step = "pick";
        render();
      }, 850);
    }
    else if (act === "fish-reroll") { UI.flow.step = "roll"; UI.flow.dice = null; UI.flow.anySquare = false; render(); }
    else if (act === "fish-any") { UI.flow.anySquare = true; render(); }
    else if (act === "fish-pick") {
      var cell = b.getAttribute("data-cell");
      var loc = fishLocation(UI.flow.loc);
      var pcs = cell.split(",");
      var name = loc.grid[+pcs[0] - 1][+pcs[1] - 1];
      UI.flow.step = "caught";
      UI.flow.caughtName = name;
      UI.flow.caughtCell = cell;
      render();
      setTimeout(function () {
        if (!UI.flow || UI.flow.step !== "caught") return;
        var fishRes = resourceByName("Fish") || S.resources[0];
        UI.pending = { resId: fishRes.id, step: "use", detail: name,
          catchMeta: { loc: UI.flow.loc, cell: UI.flow.caughtCell } };
        UI.flow = null;
        render();
      }, 1400);
    }
    else if (act === "flow-gain") { UI.pending = { resId: id, step: "use" }; UI.flow = null; render(); }
    else if (act === "flow-nothing") { UI.flow = null; render(); }
    else if (act === "cancel-flow") { UI.flow = null; render(); }
    else if (act === "gain") { UI.flow = null; UI.pending = { resId: id, step: "use" }; render(); }
    else if (act === "gained-chip") {
      var he = null;
      for (var hi = 0; hi < S.ledger.length; hi++) if (S.ledger[hi].id === id) { he = S.ledger[hi]; break; }
      if (!he || he.use !== "hold") return;
      UI.flow = null;
      if (UI.chooseUse) {
        var cu = UI.chooseUse;
        UI.chooseUse = null;
        if (cu === "sell") UI.pending = { entryId: he.id, resId: he.resId, detail: he.detail, step: "sell" };
        else if (cu === "gift") UI.pending = { entryId: he.id, resId: he.resId, detail: he.detail, step: "gift" };
        else { resolveHold(he.id, cu); return; }
      } else {
        UI.pending = { entryId: he.id, resId: he.resId, detail: he.detail, step: "use" };
      }
      render();
    }
    else if (act === "cando") {
      var cuse = b.getAttribute("data-use");
      var heldEntries = S.ledger.filter(function (e) { return e.kind === "gain" && e.use === "hold" && e.playerId === activePlayer().id; });
      if (!heldEntries.length) return;
      UI.flow = null;
      if (heldEntries.length === 1) {
        var only = heldEntries[0];
        if (cuse === "sell") UI.pending = { entryId: only.id, resId: only.resId, detail: only.detail, step: "sell" };
        else if (cuse === "gift") UI.pending = { entryId: only.id, resId: only.resId, detail: only.detail, step: "gift" };
        else { resolveHold(only.id, cuse); return; }
        render();
      } else {
        // several in hand: light them up and let the player pick which one
        UI.chooseUse = UI.chooseUse === cuse ? null : cuse;
        UI.pending = null;
        render();
      }
    }
    else if (act === "use") {
      var use = b.getAttribute("data-use");
      if (use === "sell") { UI.pending.step = "sell"; render(); }
      else if (use === "gift") { UI.pending.step = "gift"; render(); }
      else if (UI.pending.entryId) resolveHold(UI.pending.entryId, use);
      else gainResource(UI.pending.resId, use);
    }
    else if (act === "sell-coins") {
      var nSell = parseInt(b.getAttribute("data-n"), 10);
      if (UI.pending.entryId) resolveHold(UI.pending.entryId, "sell", nSell);
      else gainResource(UI.pending.resId, "sell", nSell);
    }
    else if (act === "gift-side") {
      var side = b.getAttribute("data-side");
      if (UI.pending.entryId) resolveHold(UI.pending.entryId, "gift", side);
      else gainResource(UI.pending.resId, "gift", side);
    }
    else if (act === "cancel-pending") { UI.pending = null; UI.chooseUse = null; render(); }
    else if (act === "brush") { UI.brush = id; render(); }
    else if (act === "farm-cell") {
      var ff = farmOf(activePlayer().id);
      var fk = b.getAttribute("data-cell");
      var cur = ff.cells[fk];
      var br = UI.brush;
      if (br === "till") {
        if (cur && cur.t === "till") delete ff.cells[fk]; else ff.cells[fk] = { t: "till" };
      } else if (br === "fence") {
        if (cur && cur.t === "fence") { if (cur.o === "h") cur.o = "v"; else delete ff.cells[fk]; }
        else ff.cells[fk] = { t: "fence", o: "h" };
      } else if (br && resource(br)) {
        if (cur && cur.t === "res" && cur.id === br) delete ff.cells[fk];
        else ff.cells[fk] = { t: "res", id: br };
      } else if (cur) delete ff.cells[fk];
      save(); render();
    }
    else if (act === "chop-lvl" || act === "mine-lvl") {
      var ff2 = farmOf(activePlayer().id);
      var lv = parseInt(b.getAttribute("data-lvl"), 10);
      var prop = act === "chop-lvl" ? "chopLvl" : "mineLvl";
      ff2[prop] = (ff2[prop] === lv && lv > 1) ? lv - 1 : lv; // tap the current level again to step back
      save(); render();
    }
    else if (act === "energy") {
      var fe = farmOf(activePlayer().id);
      var ei = parseInt(b.getAttribute("data-idx"), 10);
      fe.energy[ei] = ((fe.energy[ei] || 0) + 1) % 3;
      save(); render();
    }
    else if (act === "trellis") {
      var ft = farmOf(activePlayer().id);
      ft.trellis = Math.max(0, ft.trellis + parseInt(b.getAttribute("data-d"), 10));
      save(); render();
    }
    else if (act === "nb") {
      var fn = farmOf(activePlayer().id);
      var sd = b.getAttribute("data-side");
      fn[sd] = Math.max(0, Math.min(8, (fn[sd] || 0) + parseInt(b.getAttribute("data-d"), 10)));
      save(); render();
    }
    else if (act === "clear-farm") {
      if (!confirm("Reset " + activePlayer().name + "'s farm sheet? Marks, levels, energy, upgrades, and neighbor tracks all reset.")) return;
      delete S.farm[activePlayer().id];
      save(); render();
    }
    else if (act === "flow-track-gain") {
      var isChopT = b.getAttribute("data-task") === "chop";
      var fs2 = farmOf(activePlayer().id);
      var it2 = (isChopT ? CHOP_TRACK : MINE_TRACK)[(isChopT ? fs2.chopLvl : fs2.mineLvl) - 1];
      UI.flow = null;
      if (it2.coin) { adjustCoins(1); }
      else {
        var rr2 = findOrCreateResource(it2.n, it2.c);
        UI.pending = { resId: rr2.id, step: "use" };
        save(); render();
      }
    }
    else if (act === "cargo-cell") {
      var cgP = activePlayer();
      var cg2 = cargoOf(cgP.id);
      var ck = b.getAttribute("data-cell");
      if (cg2.cells[ck]) delete cg2.cells[ck];
      else if (UI.brush && resource(UI.brush)) cg2.cells[ck] = UI.brush;
      else if (S.resources[0]) { UI.brush = S.resources[0].id; cg2.cells[ck] = UI.brush; }
      save(); render();
    }
    else if (act === "clear-cargo") {
      if (!confirm("Clear " + activePlayer().name + "'s whole cargo manifest?")) return;
      cargoOf(activePlayer().id).cells = {};
      save(); render();
    }
    else if (act === "buy-project") {
      var bpk = b.getAttribute("data-key");
      var bp = null;
      BUY_PROJECTS.forEach(function (x) { if (x.key === bpk) bp = x; });
      var bpP = activePlayer();
      if (!bp || projectsOf(bpP.id)[bp.key] || coins(bpP.id) < bp.cost) return;
      addCoins(bpP.id, -bp.cost);
      projectsOf(bpP.id)[bp.key] = true;
      var bres = resourceByName(bp.name);
      if (!bres) {
        bres = { id: uid(), name: bp.name, color: SWATCHES[S.resources.length % SWATCHES.length] };
        S.resources.push(bres);
      }
      S.ledger.push({ id: uid(), playerId: bpP.id, kind: "gain", resId: bres.id, use: "hold",
        bought: { key: bp.key, cost: bp.cost } });
      save(); render();
    }
    else if (act === "coins") adjustCoins(parseInt(b.getAttribute("data-delta"), 10));
    else if (act === "program") {
      var p2 = activePlayer();
      if (coins(p2.id) < 3) return;
      addCoins(p2.id, -3);
      var isIntern = b.getAttribute("data-kind") === "intern";
      S.ledger.push({ id: uid(), playerId: p2.id, kind: "coin", delta: -3,
        label: isIntern ? "Intern Program — take any 1 main task" : "Buyback Program — cross out any 1 good" });
      save(); render();
    }
    else if (act === "pick-player") { S.activePlayer = id; UI.flow = null; UI.pending = null; UI.chooseUse = null; save(); render(); }
    else if (act === "log-task") logTask(document.getElementById("actionInput").value);
    else if (act === "remove-entry") removeEntry(id);
    else if (act === "undo") undo();
    else if (act === "add-player") {
      S.players.push({ id: uid(), name: "Player " + (S.players.length + 1) });
      save(); render();
    }
    else if (act === "remove-player") {
      if (S.players.length <= 1) return;
      var pl = player(id);
      if (!confirm("Remove " + (pl ? pl.name : "this player") + "? Their coins, unlocks, and scores are discarded.")) return;
      S.players = S.players.filter(function (x) { return x.id !== id; });
      delete S.coins[id];
      delete S.scores[id];
      delete S.unlocks[id];
      delete S.caught[id];
      delete S.cargo[id];
      delete S.projects[id];
      delete S.farm[id];
      S.ledger = S.ledger.filter(function (e) { return e.playerId !== id; });
      if (S.activePlayer === id) S.activePlayer = S.players[0].id;
      save(); render();
    }
    else if (act === "add-res") {
      S.resources.push({ id: uid(), name: "New resource", color: SWATCHES[S.resources.length % SWATCHES.length] });
      save(); render();
    }
    else if (act === "remove-res") {
      var r = resource(id);
      if (!confirm("Remove " + (r ? r.name : "this resource") + "?")) return;
      S.resources = S.resources.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    else if (act === "reset") {
      if (!confirm("Start a new game? Round, coins, unlocks, caught fish, ledger, history, and scores are cleared.")) return;
      S.round = 1;
      S.over = false;
      S.coins = {};
      S.unlocks = {};
      S.caught = {};
      S.cargo = {};
      S.projects = {};
      S.farm = {};
      S.ledger = [];
      S.history = [];
      S.scores = {};
      S.activePlayer = S.players[0].id;
      S.view = "play";
      UI.flow = null;
      UI.pending = null;
      save(); render();
    }
  });

  app.addEventListener("change", function (ev) {
    var t = ev.target;
    var act = t.getAttribute("data-act");
    if (!act) return;
    var id = t.getAttribute("data-id");
    if (act === "rename-player") { var pl = player(id); if (pl) pl.name = t.value.trim() || pl.name; save(); render(); }
    else if (act === "rename-res") { var r = resource(id); if (r) r.name = t.value.trim() || r.name; save(); render(); }
    else if (act === "recolor-res") { var r2 = resource(id); if (r2) r2.color = t.value; save(); render(); }
    else if (act === "toggle-unlock") {
      var uk = t.getAttribute("data-key");
      unlocks(activePlayer().id)[uk] = t.checked;
      // keep the farm sheet's matching upgrade in step
      var fu0 = farmOf(activePlayer().id);
      if (uk === "rod") fu0.upg.rod = t.checked;
      if (uk === "river") fu0.upg.bridge = t.checked;
      save(); render();
    }
    else if (act === "farm-upg") {
      var fuk = t.getAttribute("data-key");
      var fu = farmOf(activePlayer().id);
      fu.upg[fuk] = t.checked;
      FARM_UPGRADES.forEach(function (u) { if (u.key === fuk && u.sync) unlocks(activePlayer().id)[u.sync] = t.checked; });
      save(); render();
    }
    else if (act === "stall-label") { cargoOf(activePlayer().id).stalls[parseInt(t.getAttribute("data-idx"), 10)] = t.value; save(); }
    else if (act === "score") {
      var pid = t.getAttribute("data-pid"), field = t.getAttribute("data-field");
      if (!S.scores[pid]) S.scores[pid] = {};
      var v = parseInt(t.value, 10);
      S.scores[pid][field] = isNaN(v) ? 0 : Math.max(0, v);
      save(); render();
    }
  });

  app.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "actionInput") {
      logTask(ev.target.value);
    }
  });

  render();
})();
</script>
</body>
</html>
