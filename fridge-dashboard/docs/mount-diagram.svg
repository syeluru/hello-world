<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Side view: Yoga in tablet mode standing in a fridge-door shelf, held at the top by Command strips</title>
  <rect width="640" height="400" fill="#fbf7f0"/>

  <!-- fridge door -->
  <rect x="80" y="20" width="36" height="360" rx="4" fill="#d9dde2" stroke="#9aa3ad"/>
  <text x="98" y="392" text-anchor="middle" fill="#56606b">fridge door</text>

  <!-- laptop, leaning back slightly: bottom sits in shelf, top touches strips -->
  <g transform="translate(14 0) rotate(-4 150 318)">
    <!-- base (underside faces the door) -->
    <rect x="128" y="70" width="10" height="248" rx="3" fill="#8b929a"/>
    <!-- screen -->
    <rect x="138" y="70" width="10" height="248" rx="3" fill="#3a3f45"/>
    <rect x="148" y="78" width="3" height="232" fill="#5f8a6b"/>
    <!-- rubber feet -->
    <rect x="124" y="100" width="4" height="10" rx="2" fill="#333"/>
    <rect x="124" y="280" width="4" height="10" rx="2" fill="#333"/>
  </g>

  <!-- command strips at top -->
  <rect x="116" y="76" width="6" height="26" rx="2" fill="#4f7bb0"/>

  <!-- shelf with lip -->
  <path d="M116 320 H190 V296 H182 V312 H116 Z" fill="#c8704f"/>
  <rect x="116" y="296" width="6" height="24" fill="#c8704f"/>

  <!-- cable -->
  <path d="M156 230 C 205 230, 205 150, 190 60 S 150 10, 116 18" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="1 0"/>

  <!-- airflow -->
  <path d="M134 210 v-40" stroke="#4f7bb0" stroke-width="1.5" marker-end="url(#a)" opacity=".7"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4f7bb0"/></marker></defs>

  <!-- labels -->
  <g fill="#2b2723">
    <line x1="124" y1="89" x2="300" y2="60" stroke="#999"/>
    <text x="306" y="56">Command strips (2 pairs)</text>
    <text x="306" y="74" fill="#6f675e">stop it tipping forward; peel off to remove</text>

    <line x1="200" y1="140" x2="300" y2="140" stroke="#999"/>
    <text x="306" y="136">Charging cable</text>
    <text x="306" y="154" fill="#6f675e">up and over the door toward the hinge; leave slack</text>

    <line x1="162" y1="200" x2="300" y2="210" stroke="#999"/>
    <text x="306" y="206">Screen faces out (tablet mode)</text>
    <text x="306" y="224" fill="#6f675e">keyboard folded behind, switched off automatically</text>

    <line x1="134" y1="190" x2="300" y2="262" stroke="#999"/>
    <text x="306" y="262">Air gap from the rubber feet</text>
    <text x="306" y="280" fill="#6f675e">don't press it flat against the door</text>

    <line x1="186" y1="308" x2="300" y2="322" stroke="#999"/>
    <text x="306" y="322">Shelf with 2 cm lip carries the weight</text>
    <text x="306" y="340" fill="#6f675e">33 cm+ wide, rated 4.5 kg / 10 lb; hinge edge down</text>
  </g>
</svg>
