<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Home</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date-line">
        <span id="greeting">Hello</span>
        <span class="dot">·</span>
        <span id="date"></span>
      </div>
    </div>

    <div class="top-right">
      <div class="weather" id="weather" hidden>
        <span class="weather-icon" id="weather-icon"></span>
        <span class="weather-temp" id="weather-temp"></span>
        <span class="weather-desc" id="weather-desc"></span>
      </div>
      <button class="voice-pill" id="voice-pill" type="button" aria-label="Talk to the assistant">
        <span class="mic-dot" aria-hidden="true"></span>
        <span id="voice-hint">Say “Hello assistant”</span>
      </button>
    </div>
  </header>

  <main class="board">
    <!-- Groceries -->
    <section class="card" data-list="groceries" style="--accent: var(--sage); --accent-soft: var(--sage-soft)">
      <header class="card-head">
        <div class="card-title">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          </span>
          <h2>Groceries</h2>
        </div>
        <span class="count" data-count></span>
      </header>
      <form class="add" data-add>
        <input name="title" placeholder="Add an item…" autocomplete="off" enterkeyhint="done" aria-label="Add grocery item">
        <button type="submit" aria-label="Add">+</button>
      </form>
      <ul class="items" data-items></ul>
      <p class="empty" data-empty>Nothing on the list. Fridge is full!</p>
      <footer class="card-foot">
        <button class="link" type="button" data-clear hidden>Clear checked</button>
      </footer>
    </section>

    <!-- To-dos -->
    <section class="card" data-list="todos" style="--accent: var(--clay); --accent-soft: var(--clay-soft)">
      <header class="card-head">
        <div class="card-title">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
          </span>
          <h2>To-dos</h2>
        </div>
        <span class="count" data-count></span>
      </header>
      <form class="add" data-add>
        <input name="title" placeholder="Add a to-do…" autocomplete="off" enterkeyhint="done" aria-label="Add to-do">
        <button type="submit" aria-label="Add">+</button>
      </form>
      <ul class="items" data-items></ul>
      <p class="empty" data-empty>All caught up.</p>
      <footer class="card-foot">
        <button class="link" type="button" data-clear hidden>Clear done</button>
      </footer>
    </section>

    <!-- Events -->
    <section class="card" data-list="events" style="--accent: var(--sky); --accent-soft: var(--sky-soft)">
      <header class="card-head">
        <div class="card-title">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </span>
          <h2>Coming up</h2>
        </div>
        <span class="count" data-count></span>
      </header>
      <form class="add add-event" data-add>
        <input name="title" placeholder="Add an event…" autocomplete="off" enterkeyhint="next" aria-label="Event name">
        <div class="event-when">
          <input name="date" type="date" aria-label="Date" required>
          <input name="time" type="time" aria-label="Time (optional)">
          <button type="submit" aria-label="Add">+</button>
        </div>
      </form>
      <div class="items events" data-items></div>
      <p class="empty" data-empty>Nothing scheduled. Enjoy the quiet.</p>
    </section>
  </main>

  <!-- Voice overlay -->
  <div class="voice-overlay" id="voice-overlay" hidden>
    <div class="voice-panel">
      <div class="orb" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="voice-status" id="voice-status">Listening…</p>
      <p class="voice-transcript" id="voice-transcript"></p>
      <p class="voice-examples">Try “add milk and eggs to the grocery list”, “remind me to call the plumber”,
        or “dentist on Friday at 3pm”.</p>
      <button class="link" type="button" id="voice-cancel">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
